<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>政瞳跑酷 · 活力冲刺</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{ --gold:#F2C14E; --gold2:#E09A2E; --orange:#FF8A3C; --ink:#3A241A; --cream:#FFF3E2; }
  html,body{height:100%;overflow:hidden;}
  body{ color:var(--cream);font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;background:#14101f; }
  .app{position:relative;width:100%;height:100%;overflow:hidden;}
  #scene{display:block;width:100%;height:100%;touch-action:none;}

  /* ===== 顶部 HUD ===== */
  .hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;}
  .hud .score{font-size:26px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);font-variant-numeric:tabular-nums;}
  .hud .score small{font-size:11px;color:#cdd9ec;letter-spacing:2px;display:block;font-weight:500;}
  .hud .right{text-align:right;font-size:12px;color:#c2d0e6;line-height:1.7;text-shadow:0 1px 6px rgba(0,0,0,.5);}
  .hud .right b{color:var(--gold);font-variant-numeric:tabular-nums;}
  .coinbar{position:absolute;top:70px;left:16px;display:flex;align-items:center;gap:6px;font-size:13px;color:#FFD98A;z-index:5;text-shadow:0 1px 6px rgba(0,0,0,.5);}

  /* ===== 触屏按键 ===== */
  .pad{position:absolute;left:0;right:0;bottom:18px;z-index:6;display:none;justify-content:space-between;padding:0 18px;pointer-events:none;}
  .pad.show{display:flex;}
  .pad .side{display:flex;gap:12px;pointer-events:auto;}
  .pad button{width:62px;height:62px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(18,24,40,.55);color:#fff;font-size:20px;font-family:inherit;backdrop-filter:blur(4px);cursor:pointer;user-select:none;}
  .pad button:active{background:rgba(242,193,78,.4);transform:scale(.93);}
  .pad .mid{display:flex;gap:12px;pointer-events:auto;}
  .pad button.small{font-size:14px;}

  .runner-img{position:absolute;left:0;top:0;z-index:3;width:112px;pointer-events:none;
    transform-origin:center bottom;filter:drop-shadow(0 0 7px rgba(255,255,255,.28)) drop-shadow(0 6px 8px rgba(0,0,0,.35));will-change:transform;}
  .runner-shadow{position:absolute;left:0;top:0;z-index:2;width:72px;height:18px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.42),rgba(0,0,0,0));pointer-events:none;will-change:transform;}

  .flash{position:absolute;inset:0;background:rgba(255,60,60,.32);opacity:0;transition:opacity .18s;z-index:7;pointer-events:none;}
  footer{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10.5px;color:rgba(255,255,255,.4);letter-spacing:1px;z-index:4;}

  /* ===== 启动遮罩 ===== */
  .overlay{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;overflow:hidden;
    background:linear-gradient(150deg,#ffb53a 0%,#ff8a3c 45%,#ff6b5e 100%);}
  .overlay.hide{display:none;}
  .overlay::before{content:"";position:absolute;inset:0;background:
    radial-gradient(circle at 18% 22%,rgba(255,255,255,.22),transparent 26%),
    radial-gradient(circle at 85% 18%,rgba(255,255,255,.18),transparent 22%),
    radial-gradient(circle at 80% 82%,rgba(255,120,80,.35),transparent 30%);}

  .deco{position:absolute;pointer-events:none;opacity:.7;}
  .tri{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:24px solid #fff;}
  .tri.b{border-bottom-color:#ffe08a;}
  .circ{width:18px;height:18px;border-radius:50%;background:#fff;}
  .circ.g{background:#ffe08a;}
  .sq{width:20px;height:20px;border-radius:5px;background:#fff;transform:rotate(24deg);}
  .star{color:#fff;font-size:22px;line-height:1;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(14deg)}}
  @keyframes floaty2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(12px) rotate(-12deg)}}

  .topbar{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:auto;}
  .topbar .grp{display:flex;gap:18px;font-size:11px;color:rgba(255,255,255,.9);letter-spacing:1px;}
  .topbar .ic{display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.95;}
  .topbar .ic .dot{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:14px;}
  .ic-btn{cursor:pointer;transition:.15s;}
  .ic-btn:active{transform:scale(.9);}
  .ic-btn .dot{background:rgba(255,255,255,.3);}

  /* 通用弹层 */
  .modal-mask{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,14,26,.55);backdrop-filter:blur(3px);padding:24px;}
  .modal-mask.show{display:flex;}
  .modal-card{width:min(330px,90%);background:#fff;border-radius:24px;padding:20px 18px;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .28s cubic-bezier(.2,1.4,.4,1);color:var(--ink);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .modal-head span{font-size:17px;font-weight:800;}
  .modal-x{width:30px;height:30px;border:none;border-radius:50%;background:#f2e2d2;color:var(--ink);font-size:18px;cursor:pointer;line-height:1;}
  .modal-body{font-size:13px;color:#5a4a3a;line-height:1.7;}
  .mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0e4d6;}
  .mrow:last-child{border-bottom:none;}
  .switch{width:46px;height:26px;border-radius:999px;background:#d8c8b8;position:relative;cursor:pointer;transition:.2s;}
  .switch.on{background:var(--gold2);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch.on::after{left:23px;}
  .mbtn{margin-top:12px;width:100%;padding:11px;border:none;border-radius:14px;background:var(--gold);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
  .mbtn.ghost{background:#f2e2d2;color:var(--ink);}
  .mnote{background:#fff6ea;border-radius:14px;padding:12px;margin-top:6px;font-size:12.5px;color:#7a6248;}
  .mstat{display:flex;gap:10px;margin-top:8px;}
  .mstat .box{flex:1;background:#fff6ea;border-radius:14px;padding:10px;text-align:center;}
  .mstat .box b{display:block;font-size:18px;color:var(--gold2);}


  /* 双人横幅 */
  .duo-banner{position:relative;z-index:2;width:230px;margin:6px 0 2px;}
  .duo-banner img{width:100%;display:block;filter:drop-shadow(0 8px 14px rgba(150,50,10,.3));}

  .duo{position:relative;display:flex;gap:16px;margin:4px 0 4px;z-index:2;}
  .rcard{width:104px;padding:8px 6px 10px;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 10px 24px rgba(180,70,20,.35);cursor:pointer;transition:.22s;border:2.5px solid transparent;}
  .rcard img{width:76px;max-height:84px;object-fit:contain;display:block;margin:0 auto 4px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.25));}
  .rcard .nm{font-size:13px;font-weight:700;color:var(--ink);}
  .rcard .tg{display:block;font-size:10px;color:#a6724a;margin-top:2px;}
  .rcard.on{border-color:var(--gold);transform:translateY(-6px) scale(1.03);box-shadow:0 14px 30px rgba(180,70,20,.45);}

  .title{position:relative;z-index:2;margin:2px 0 2px;}
  .title h1{font-size:36px;font-weight:900;letter-spacing:4px;color:#fff;
    text-shadow:0 2px 0 #c85a20,0 4px 0 #c85a20,0 6px 0 rgba(150,50,10,.55),3px 4px 0 rgba(150,50,10,.25);
    transform:rotate(-2deg);}
  .title h1 span{color:#ffe08a;}
  .title .sub{font-size:12px;color:rgba(255,255,255,.92);letter-spacing:3px;margin-top:2px;}

  .opts{position:relative;z-index:2;margin:14px 0 4px;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .opts .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .opt{padding:8px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);color:#fff;font-size:13px;cursor:pointer;font-family:inherit;transition:.18s;}
  .opt.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(150,50,10,.3);}

  .btn{position:relative;z-index:2;margin-top:18px;padding:14px 44px;border-radius:999px;border:none;background:#fff;color:var(--ink);font-size:16px;letter-spacing:3px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 8px 0 #d97a28,0 14px 22px rgba(150,50,10,.35);transition:.16s;}
  .btn:active{transform:translateY(5px);box-shadow:0 3px 0 #d97a28,0 6px 12px rgba(150,50,10,.3);}
  .btn:disabled{opacity:.72;cursor:progress;filter:saturate(.7);}
  .btn.ghost{background:rgba(255,255,255,.2);color:#fff;box-shadow:0 5px 0 rgba(150,50,10,.35);margin-left:10px;}

  .keys{position:relative;z-index:2;margin-top:14px;font-size:11.5px;color:rgba(255,255,255,.85);line-height:1.9;}
  .keys kbd{display:inline-block;padding:1px 7px;border-radius:5px;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.3);font-size:11px;margin:0 2px;}

  /* ===== 结算卡片 ===== */
  .result-mask{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(10,14,26,.55);backdrop-filter:blur(3px);}
  .result-mask.show{display:flex;}
  .result-card{width:min(320px,84%);background:#fff;border-radius:26px;padding:26px 22px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,1.4,.4,1);}
  @keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .result-card .tag{font-size:12px;letter-spacing:3px;color:#a6724a;font-weight:600;}
  .result-card .big{font-size:46px;color:var(--ink);font-weight:900;margin:6px 0;font-variant-numeric:tabular-nums;}
  .result-card .row{font-size:13px;color:#6a5a4a;margin-top:6px;}
  .result-card .row b{color:var(--gold2);}
  .result-card .actions{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .result-card .btn{margin-top:0;padding:11px 18px;font-size:14px;box-shadow:0 6px 0 #d97a28,0 10px 16px rgba(150,50,10,.3);}
  .result-card .btn.ghost{background:#f2e2d2;color:var(--ink);box-shadow:0 4px 0 #d8b89a;}
.engine-fail{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;max-width:330px;padding:24px 22px;border-radius:22px;background:rgba(255,250,242,.96);color:#4A2E21;box-shadow:0 20px 50px rgba(70,30,10,.24);font-size:14px;line-height:1.7;}
.engine-fail b{font-size:18px;letter-spacing:1px;}
.engine-fail span{font-size:13px;color:#7A5744;}
</style>
</head>
<body>
<div class="app">
  <canvas id="scene"></canvas>
  <div class="runner-shadow" id="runnerShadow"></div>
  <img id="runnerImg" class="runner-img" alt="runner" />

  <div class="hud">
    <div class="score"><small>SCORE</small><span id="scoreTxt">0</span></div>
    <div class="right">最高 <b id="bestTxt">0</b><br />速度 <b id="spdTxt">1.0x</b></div>
  </div>
  <div class="coinbar">⭐ <span id="coinTxt">0</span></div>

  <div class="pad" id="pad">
    <div class="side">
      <button id="btnL">←</button>
      <button id="btnR">→</button>
    </div>
    <div class="mid">
      <button id="btnUp" class="small">跳</button>
      <button id="btnDown" class="small">滑</button>
    </div>
  </div>

  <div class="flash" id="flash"></div>

  <!-- 启动遮罩 -->
  <div class="overlay" id="startOverlay">
    <div class="topbar">
      <div class="grp">
        <div class="ic ic-btn" id="btnSetting"><div class="dot">⚙</div><span>设置</span></div>
        <div class="ic ic-btn" id="btnSound"><div class="dot" id="soundIcon">🔊</div><span id="soundLabel">声音</span></div>
      </div>
      <div class="grp">
        <div class="ic ic-btn" id="btnAccount"><div class="dot">👤</div><span>账号</span></div>
        <div class="ic ic-btn" id="btnNotice"><div class="dot">📢</div><span>公告</span></div>
      </div>
    </div>

    <div class="modal-mask" id="modalMask">
      <div class="modal-card">
        <div class="modal-head"><span id="modalTitle">设置</span><button class="modal-x" id="modalClose">×</button></div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <div class="deco tri b" style="top:18%;left:10%;animation:floaty 3.2s ease-in-out infinite;"></div>
    <div class="deco circ" style="top:30%;left:82%;animation:floaty2 3.8s ease-in-out infinite;"></div>
    <div class="deco sq" style="top:64%;left:8%;animation:floaty 4s ease-in-out infinite;"></div>
    <div class="deco star" style="top:24%;left:70%;animation:floaty2 3.4s ease-in-out infinite;">✦</div>
    <div class="deco circ g" style="top:72%;left:86%;animation:floaty 3.6s ease-in-out infinite;"></div>

    <div class="duo-banner"><img src="./parkour-assets/parkour-duo.webp" alt="思瞳和孙政" /></div>

    <div class="duo" id="duo">
      <div class="rcard on" data-who="sitong">
        <img src="./parkour-assets/parkour-sitong.webp" alt="思瞳" />
        <div class="nm">思瞳</div><span class="tg">小跑步·灰卫衣</span>
      </div>
      <div class="rcard" data-who="sunzheng">
        <img src="./parkour-assets/parkour-sunzheng.webp" alt="孙政" />
        <div class="nm">孙政</div><span class="tg">小跑步·黑夹克</span>
      </div>
    </div>

    <div class="title">
      <h1>政瞳<span>跑酷</span></h1>
      <div class="sub">AYLIO · 政在瞳行 · 活力冲刺</div>
    </div>

    <div class="opts">
      <div class="row" id="sceneRow">
        <button class="opt on" data-scene="metro">🚇 枫叶铁轨</button>
        <button class="opt" data-scene="road">🛣️ 城市公路</button>
        <button class="opt" data-scene="canyon">⛰️ 丛林土路</button>
      </div>
      <div class="row" id="periodRow">
        <button class="opt" data-period="day">☀️ 白天</button>
        <button class="opt on" data-period="night">🌙 夜晚</button>
      </div>
    </div>

    <button class="btn" id="btnStart" disabled>3D 引擎加载中…</button>
    <div class="keys">键盘 <kbd>←</kbd><kbd>→</kbd> 闪身 · <kbd>↑</kbd>/<kbd>空格</kbd> 跳跃 · <kbd>↓</kbd> 下滑<br />手机可直接滑动屏幕，或用底部按钮</div>
  </div>

  <!-- 结算卡片 -->
  <div class="result-mask" id="resultMask">
    <div class="result-card">
      <div class="tag">本局结束</div>
      <div class="big" id="resScore">0</div>
      <div class="row">收集星星 <b id="resCoin">0</b></div>
      <div class="row" id="resBest">最高分 0</div>
      <div class="actions">
        <button class="btn" id="btnAgain">再来一次</button>
        <button class="btn ghost" id="btnBack">换个角色</button>
        <button class="btn ghost" id="btnHome">返回首页</button>
      </div>
    </div>
  </div>

  <footer>© 2026 政瞳之家 · 粉丝自制小游戏</footer>
</div>

<script type="module">
/* 3D 引擎分块加载：GitHub Pages 单次大文件传输在部分网络下会中断，
   拆成 6 个约 85KB 的小块，再在浏览器里拼成模块，稳定性更高。 */
async function fetchText(url,timeout=18000){
  for(let attempt=0;attempt<3;attempt++){
    const ac=new AbortController();
    const timer=setTimeout(()=>ac.abort(),timeout);
    try{
      const res=await fetch(url,{signal:ac.signal,cache:attempt?'reload':'default'});
      clearTimeout(timer);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text=await res.text();
      if(!text.length) throw new Error('empty chunk');
      return text;
    }catch(e){
      clearTimeout(timer);
      if(attempt===2) throw e;
      await new Promise(r=>setTimeout(r,600));
    }
  }
}
let THREE = null;
const btnStartEl=document.getElementById('btnStart');
function moduleFromText(code){
  if(code.length<500000) throw new Error('bundle incomplete: '+code.length);
  const blobUrl=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
  return import(blobUrl).finally(()=>URL.revokeObjectURL(blobUrl));
}
try{
  // 本地调试直接读站内引擎，线上走 Supabase 免费公共存储
  if(btnStartEl) btnStartEl.textContent='3D 引擎加载中…';
  if(location.hostname==='127.0.0.1'||location.hostname==='localhost'){
    THREE=await import('./three.module.min.js');
  }else{
    const code=await fetchText('https://yzzktnkfprpystxbhnln.supabase.co/storage/v1/object/public/wall/games/three-parkour.min.js?v=3',20000);
    THREE=await moduleFromText(code);
  }
}catch(err){
  console.warn('云端 3D 引擎加载失败，改用站内分块：',err);
  try{
    const parts=new Array(6);
    let done=0;
    await Promise.all([1,2,3,4,5,6].map(async i=>{
      parts[i-1]=await fetchText('./three-chunks/part-'+i+'.js?v=1124g');
      done++;
      if(btnStartEl) btnStartEl.textContent='3D 引擎加载中… '+done+'/6';
    }));
    THREE=await moduleFromText(parts.join(''));
  }catch(err2){
    console.warn('站内分块也失败，尝试 CDN：',err2);
    for (const url of [
      'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
      'https://unpkg.com/three@0.160.0/build/three.module.min.js'
    ]) {
      try { THREE = await import(url); break; }
      catch(e) { console.warn('3D 引擎加载失败：', url, e); }
    }
  }
}
if (!THREE) {
  const overlay = document.getElementById('startOverlay');
  if (overlay) {
    overlay.classList.remove('hide');
    overlay.innerHTML = '<div class="engine-fail"><b>3D 引擎没有加载出来</b><span>请刷新页面重试；如果还是不行，换用 Chrome 或 Safari 打开。</span></div>';
  }
  throw new Error('three.js unavailable');
}

const CHAR_SRC = { sitong:'./parkour-assets/parkour-sitong.webp', sunzheng:'./parkour-assets/parkour-sunzheng.webp' };

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 300);
camera.position.set(0,2.30,3.60);

/* ============ 灯光 ============ */
const ambient = new THREE.AmbientLight(0x4a6a9c, 1.0); scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x5a86c4, 0x0c1a2c, 1.1); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff0cf, 2.0); key.position.set(-7,16,10); scene.add(key);
const rim = new THREE.DirectionalLight(0x86b4ff, 1.2); rim.position.set(6,9,-12); scene.add(rim);

const LANES = [-1.95, 0, 1.95];
const G = 0.9;

/* ============ 主题包 ============ */
const THEMES = {
  metro: {
    day:  { sky:0xf0dcae, fog:0xe8cf9e, fogD:0.018, ambient:0xf2e4c2, ambI:1.15, hemiSky:0xf6e8c8, hemiGround:0x7a5a3a, hemiI:1.0, key:0xfff2d8, keyI:2.3, rim:0xe8c89a,

function groundTexture(prop, lineColor){
  const c = document.createElement('canvas'); c.width=256; c.height=512;
  const g = c.getContext('2d');
  if(prop==='city'){
    g.fillStyle='#3c4046'; g.fillRect(0,0,256,512);
    for(let i=0;i<900;i++){ g.fillStyle=`rgba(${Math.random()<.5?20:90},${Math.random()<.5?20:90},${Math.random()<.5?24:96},.25)`; g.fillRect(Math.random()*256,Math.random()*512,1.4,1.4); }
    g.fillStyle=lineColor; g.fillRect(14,0,5,512); g.fillRect(237,0,5,512);
    g.globalAlpha=.85; [85,171].forEach(x=>{ for(let y=0;y<512;y+=64){ g.fillRect(x-3,y+12,6,30); } });
  } else if(prop==='maple'){
    g.fillStyle='#5d5144'; g.fillRect(0,0,256,512);
    for(let i=0;i<1100;i++){ const v=60+Math.random()*70|0; g.fillStyle=`rgba(${v},${v-12},${v-24},.55)`; g.beginPath(); g.arc(Math.random()*256,Math.random()*512,1+Math.random()*1.6,0,7); g.fill(); }
  } else {
    g.fillStyle='#a8835a'; g.fillRect(0,0,256,512);
    for(let i=0;i<900;i++){ const v=120+Math.random()*60|0; g.fillStyle=`rgba(${v},${v-30},${v-58},.3)`; g.fillRect(Math.random()*256,Math.random()*512,1.6,1.6); }
    g.globalAlpha=.5; g.fillStyle=lineColor;
    [85,171].forEach(x=>{ for(let y=0;y<512;y+=72){ g.fillRect(x-2,y+14,4,26); } });
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1,14);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

const PALETTES = {
  sitong: { hood:0x9AA6B5, hood2:0xB8C1CC, pants:0x3C414B, hair:0x7A4E33, hair2:0x95613F, skin:0xF3CBA8, shoe:0xF4F0E8, sole:0x30343B, accent:0xD3DAE4 },
  sunzheng: { hood:0x25272E, hood2:0x343740, pants:0x1B1C21, hair:0x19181D, hair2:0x34303C, skin:0xF0C6A1, shoe:0x4A382F, sole:0x2B211C, accent:0xE2E4E8 }
};
function buildRunner(who){
  const C=PALETTES[who] || PALETTES.sitong;
  const root=new THREE.Group();
  const rig=new THREE.Group(); root.add(rig);

  const mat=(c,rough=.98)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:0});
  const skin=mat(C.skin,.9), cloth=mat(C.hood,.96), cloth2=mat(C.hood2,.97);
  const pants=mat(C.pants,.97), hair=mat(C.hair,.94), hair2=mat(C.hair2,.95);
  const shoe=mat(C.shoe,.9), sole=mat(C.sole,.95), accent=mat(C.accent,.9);
  const white=mat(0xF7F3EA,.92), pink=mat(0xD9948D,.9);
  const irisMat=mat(0x3E2618,.7), eyeW=mat(0xFFFCF6,.55);
  const dark=mat(0x2A1B12,.8);

  const mesh=(geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,m); o.position.set(x,y,z); return o;};
  const ball=(r,m,x,y,z,sx=1,sy=1,sz=1,seg=20)=>{const o=mesh(new THREE.SphereGeometry(r,seg,Math.max(10,Math.round(seg*.72))),m,x,y,z); o.scale.set(sx,sy,sz); return o;};
  const seg=(rt,rb,h,m,x,y,z,segments=16)=>{const o=mesh(new THREE.CylinderGeometry(rt,rb,h,segments,2),m,x,y,z); o.geometry.computeVertexNormals(); return o;};

  /* ---------- 胖乎乎的短身体：连帽衫/夹克 ---------- */
  rig.add(ball(.215,pants,0,.690,0,1.06,.66,.90,24));
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.212,.200,8,26),cloth);
  torso.position.y=.930; torso.scale.set(1.05,1,.84); rig.add(torso);
  // 肩膀
  rig.add(ball(.082,cloth,-.208,1.090,0,1.06,.95,.92));
  rig.add(ball(.082,cloth, .208,1.090,0,1.06,.95,.92));

  if(who==='sitong'){
    // 帽兜：从背后看是一整团柔软帽子
    rig.add(ball(.225,cloth2,0,1.145,.115,1.14,.56,.78,20));
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.142,.036,8,22),cloth2);
    ring.position.set(0,1.195,.045); ring.rotation.x=Math.PI/2; rig.add(ring);
    const hemp=new THREE.Mesh(new THREE.TorusGeometry(.207,.012,8,26),mat(0x66707C,.98));
    hemp.position.set(0,.641,0); hemp.rotation.x=Math.PI/2; hemp.scale.z=.84; rig.add(hemp);
    for(const x of [-.050,.050]){
      const cord=seg(.008,.008,.145,accent,x,1.015,-.176,8); cord.rotation.z=x>0?.12:-.12; rig.add(cord);
      rig.add(ball(.012,accent,x,0.940,-.181,1,1,1,8));
    }
  }else{
    // 黑夹克：下摆露白T、立领、银拉链
    const tee=seg(.210,.214,.070,white,0,.654,0,24); tee.scale.z=.84; rig.add(tee);
    const zip=mesh(new THREE.BoxGeometry(.011,.300,.012),accent,0,.955,-.178); rig.add(zip);
    for(const side of [-1,1]){
      const lap=mesh(new THREE.BoxGeometry(.090,.024,.095),cloth2,side*.072,1.160,-.120);
      lap.rotation.z=side*-.34; rig.add(lap);
    }
    rig.add(ball(.190,cloth2,0,1.170,.075,1.15,.48,.68,18));
    const hem=new THREE.Mesh(new THREE.TorusGeometry(.205,.016,8,24),cloth2);
    hem.position.set(0,.650,0); hem.rotation.x=Math.PI/2; hem.scale.z=.84; rig.add(hem);
  }

  /* ---------- 短手臂 + 胖手 ---------- */
  function makeArm(side){
    const shoulder=new THREE.Group(); shoulder.position.set(side*.214,1.082,0);
    const upper=new THREE.Mesh(new THREE.CapsuleGeometry(.054,.130,6,14),cloth);
    upper.position.y=-.095; shoulder.add(upper);
    const elbow=new THREE.Group(); elbow.position.y=-.190; shoulder.add(elbow);
    const fore=new THREE.Mesh(new THREE.CapsuleGeometry(.047,.120,6,14),cloth);
    fore.position.y=-.085; elbow.add(fore);
    const cuff=new THREE.Mesh(new THREE.TorusGeometry(.052,.014,6,16),cloth2);
    cuff.position.y=-.160; cuff.rotation.x=Math.PI/2; elbow.add(cuff);

    const handG=new THREE.Group(); handG.position.y=-.190; elbow.add(handG);
    handG.add(ball(.054,skin,0,-.018,0,1.0,.92,.72,14));
    for(let i=0;i<4;i++){
      const f=new THREE.Mesh(new THREE.CapsuleGeometry(.011,.030,4,8),skin);
      f.position.set((i-1.5)*.023,-.060,-.012); f.rotation.x=.45; handG.add(f);
    }
    const thumb=new THREE.Mesh(new THREE.CapsuleGeometry(.012,.028,4,8),skin);
    thumb.position.set(side*-.045,-.022,-.005); thumb.rotation.z=side*.9; handG.add(thumb);
    rig.add(shoulder); return {shoulder,elbow,handG};
  }
  const armL=makeArm(-1), armR=makeArm(1);
  armL.shoulder.rotation.z=.10; armR.shoulder.rotation.z=-.10;

  /* ---------- 短腿 + 厚底球鞋 ---------- */
  function makeLeg(side){
    const hip=new THREE.Group(); hip.position.set(side*.096,.682,0);
    const thigh=new THREE.Mesh(new THREE.CapsuleGeometry(.095,.135,6,14),pants);
    thigh.position.y=-.105; hip.add(thigh);
    const knee=new THREE.Group(); knee.position.y=-.238; hip.add(knee);
    knee.add(ball(.075,pants,0,0,0,1,.95,1,12));
    const calf=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.120,6,14),pants);
    calf.position.y=-.085; knee.add(calf);
    const cuff=new THREE.Mesh(new THREE.TorusGeometry(.060,.013,6,14),pants);
    cuff.position.y=-.148; cuff.rotation.x=Math.PI/2; knee.add(cuff);

    const ankle=new THREE.Group(); ankle.position.y=-.195; knee.add(ankle);
    ankle.add(ball(.052,skin,0,-.010,0,1,.86,.92,12));
    const shoeG=new THREE.Group(); shoeG.position.y=-.082; ankle.add(shoeG);
    const body=new THREE.Mesh(new THREE.CapsuleGeometry(.080,.160,6,16),shoe);
    body.rotation.x=Math.PI/2; body.scale.set(1.08,.92,1.0); body.position.set(0,.010,-.050); shoeG.add(body);
    shoeG.add(ball(.078,shoe,0,.002,-.145,1.02,.88,1.15,16));
    const soleMesh=mesh(new THREE.BoxGeometry(.170,.040,.330),sole,0,-.056,-.052); shoeG.add(soleMesh);
    shoeG.add(ball(.074,sole,0,-.046,-.180,1.02,.34,1.05,14));
    for(let i=0;i<3;i++){
      const lace=mesh(new THREE.BoxGeometry(.086,.010,.018),accent,0,.065,-.070-i*.036);
      lace.rotation.x=-.16; shoeG.add(lace);
    }
    rig.add(hip); return {hip,knee,ankle};
  }
  const legL=makeLeg(-1), legR=makeLeg(1);

  /* ---------- 大头：蓬松发团 + 猫耳 ---------- */
  const neck=seg(.072,.084,.090,skin,0,1.225,0,14); rig.add(neck);
  const headG=new THREE.Group(); headG.position.y=1.405; rig.add(headG);
  const skull=ball(.262,skin,0,0,0,.98,1.00,.94,26); headG.add(skull);
  headG.add(ball(.175,skin,0,-.120,-.030,1.0,.78,.94,20)); // 下巴

  // 发盖
  const cap=new THREE.Mesh(new THREE.SphereGeometry(.276,28,20,0,Math.PI*2,0,Math.PI*.44),hair);
  cap.scale.set(1.02,1.05,.98); headG.add(cap);
  const backHair=new THREE.Mesh(new THREE.SphereGeometry(.278,28,20,0,Math.PI,0,Math.PI*.82),hair);
  backHair.scale.set(1.0,1.02,1.0); headG.add(backHair);

  // 自定义发束：宽根、尖梢、微弯，做出黏土捏出来的层次
  function hairLockGeo(len,r0,curve,wide=1.18,flat=.62){
    const rings=7, seg=8, pos=[], idx=[];
    for(let i=0;i<=rings;i++){
      const t=i/rings, rr=r0*Math.pow(1-t,.72)+.003;
      const yy=-t*len, zz=curve*Math.sin(Math.PI*t*.92);
      for(let j=0;j<seg;j++){
        const a=j/seg*Math.PI*2;
        pos.push(Math.cos(a)*rr*wide, yy, Math.sin(a)*rr*flat+zz);
      }
    }
    for(let i=0;i<rings;i++){
      for(let j=0;j<seg;j++){
        const a=i*seg+j, b=i*seg+(j+1)%seg, c=(i+1)*seg+j, d=(i+1)*seg+(j+1)%seg;
        idx.push(a,c,b, b,c,d);
      }
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    geo.setIndex(idx); geo.computeVertexNormals(); return geo;
  }
  const hairLocks=[
    [-.225,-.030,.170,-.34,-.12,.120,.088,0],
    [.225,-.030,.170,.34,-.12,.120,.088,0],
    [-.120,-.145,.205,-.06,-.06,.110,.078,0],
    [.120,-.145,.205,.06,-.06,.110,.078,0],
    [0,-.185,.215,0,-.05,.100,.070,0]
  ];
  // 后脑几缕收梢，避免像一整颗头盔
  for(const [x,y,z,rz,len,r] of [
    [-.130,-.105,.212,-.10,.115,.070],
    [0,-.120,.220,0,.125,.075],
    [.130,-.105,.212,.10,.115,.070]
  ]){
    const lk=new THREE.Mesh(hairLockGeo(len,r,.022,1.05,.62),hair);
    lk.position.set(x,y,z); lk.rotation.set(.06,0,rz); headG.add(lk);
  }
  // 头顶两撮小翘发
  for(const [x,rz,len] of [[-.155,-2.72,.100],[.155,2.72,.100]]){
    const lk=new THREE.Mesh(hairLockGeo(len,.070,.028,1.0,.7),hair2);
    lk.position.set(x,.235,.055); lk.rotation.set(-.18,0,rz); headG.add(lk);
  }
  // 中间一根短短的小翘发
  const ahoge=new THREE.Mesh(hairLockGeo(.105,.030,.018),hair2);
  ahoge.position.set(.012,.300,.048); ahoge.rotation.set(Math.PI+.24,0,.42); headG.add(ahoge);

  // 前额刘海：软发束，不遮眼
  for(let i=0;i<6;i++){
    const a=(i-2.5)/3.0;
    const lk=new THREE.Mesh(hairLockGeo(.150+(i%2)*.020,.058,0),hair);
    lk.position.set(a*.178,.172,-.246+Math.abs(a)*.022);
    lk.rotation.set(.30,0,a*.55); headG.add(lk);
  }
  // 鬓角
  for(const side of [-1,1]){
    const burn=new THREE.Mesh(new THREE.ConeGeometry(.034,.145,7),hair2);
    burn.position.set(side*.232,-.015,-.010); burn.rotation.set(Math.PI-.18,0,side*-.18); headG.add(burn);
  }

  // 猫耳
  for(const side of [-1,1]){
    const ear=new THREE.Mesh(new THREE.ConeGeometry(.108,.245,9),hair);
    ear.position.set(side*.185,.292,.010); ear.rotation.z=side*-.28; ear.scale.z=.58; headG.add(ear);
    const inner=new THREE.Mesh(new THREE.ConeGeometry(.060,.150,9),pink);
    inner.position.set(side*.181,.294,-.045); inner.rotation.z=side*-.28; inner.scale.z=.42; headG.add(inner);
  }

  // 脸：圆眼、眉毛、鼻、笑嘴
  headG.add(ball(.238,skin,0,-.010,-.112,.94,.98,.52,24));
  for(const side of [-1,1]){
    const eye=ball(.043,irisMat,side*.086,.010,-.252,1.08,.90,.32,18); headG.add(eye);
    headG.add(ball(.012,eyeW,side*.096,.028,-.266,1,1,.4,8));
    const brow=mesh(new THREE.BoxGeometry(.070,.012,.009),hair2,side*.083,.104,-.246); brow.rotation.z=side*-.12; headG.add(brow);
  }
  headG.add(ball(.019,skin,0,-.030,-.268,1,.9,.7,10));
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(.035,.0055,6,16,Math.PI),mat(0x8E4F49,.85));
  mouth.position.set(0,-.092,-.268); mouth.rotation.z=Math.PI; headG.add(mouth);

  return {root,rig,headG,headY:1.405,armL,armR,legL,legR};
}

function disposeRunner(group){
  group.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){ if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose()); else o.material.dispose(); }

function loadSpriteTex(who,pose){
  const key=who+'-'+pose; if(spriteTex[key]) return;
  const im=new Image();
  im.onload=function(){
    try{
      const cv=document.createElement('canvas'); cv.width=im.naturalWidth||im.width; cv.height=im.naturalHeight||im.height;
      cv.getContext('2d').drawImage(im,0,0);
      const tex=new THREE.CanvasTexture(cv);
      if(THREE.SRGBColorSpace) tex.colorSpace=THREE.SRGBColorSpace;
      tex.needsUpdate=true; spriteTex[key]=tex;
      if(state.who===who && spritePose===pose) paintSprite(who,pose);
    }catch(err){ window.__spriteErr=String(err); }
  };
  im.onerror=function(){ window.__spriteErr='loadfail '+SPRITE_SRC[who][pose]; };
  im.src=SPRITE_SRC[who][pose];
}
function paintSprite(who,pose){
  if(!runnerSprite) return;
  const tex=spriteTex[who+'-'+pose];
  const h=pose==='slide'?1.10:(pose==='jump'?1.74:1.82);
  const asp=tex&&tex.image?tex.image.width/tex.image.height:0.55;
  runnerSprite.material.map=tex||null;
  runnerSprite.material.needsUpdate=true;
  runnerSprite.scale.set(h*asp,h,1);
  spritePose=pose; spriteWho=who;
}
function spawnRunnerModel(){
  if(runner3D){ scene.remove(runner3D.root); disposeRunner(runner3D.root); runner3D=null; }
  if(runnerSprite){ scene.remove(runnerSprite); if(runnerSprite.material) runnerSprite.material.dispose(); }
  runnerSprite=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,depthWrite:false,alphaTest:0.02}));
  runnerSprite.position.set(0,.90,0); scene.add(runnerSprite);
  spritePose=''; spriteWho='';
  paintSprite(state.who,'run');
  ['run','jump','slide'].forEach(function(p){ loadSpriteTex(state.who,p); });
  placeRunner();
}

function placeRunner(){
  if(runnerSprite){
    const pose=state.slideT>0?'slide':(state.jumpY>.03?'jump':'run');
    const cy=pose==='slide'?.58:(pose==='jump'?.88:.91);
    runnerSprite.position.set(state.x,cy+state.jumpY,0);
  }
  if(!runner3D) return;
  runner3D.root.position.set(state.x,state.jumpY,0);
  const lift=Math.min(.72,state.jumpY*.42);
  const sc=1-lift*.42;
  runnerShadow.position.set(state.x,.012,0);
  runnerShadow.scale.set(sc*.92,sc*.92,1);
  runnerShadow.material.opacity=.60*(1-Math.min(.65,lift));
  charLight.position.set(state.x,state.jumpY+2.6,1.2);
}

function poseSprite(t){
  if(!runnerSprite) return;
  const run=state.phase==='run';
  const slide=run && state.slideT>0;
  const jump=run && state.jumpY>.03;
  const pose=slide?'slide':(jump?'jump':'run');
  if(pose!==spritePose) paintSprite(state.who,pose);
  let rot=0;
  if(run && !slide){
    rot=Math.sin(state.t*12.6)*.025;
    if(jump) rot*=.35;
  }
  if(run && state.dodgeT>0){
    const k=state.dodgeT/.34;
    rot += -state.dodgeDir*.22*k;
    runnerSprite.position.x = state.x + state.dodgeDir*.060*k;
  }
  runnerSprite.material.rotation=rot;
}

function poseRunner(t){
  const p=runner3D; if(!p) return;
  const run=state.phase==='run';
  const slide=run && state.slideT>0;
  const jump=run && state.jumpY>.03;

  p.rig.position.set(0,0,0); p.rig.rotation.set(0,0,0); p.rig.scale.set(1,1,1);
  p.legL.hip.rotation.set(0,0,0); p.legR.hip.rotation.set(0,0,0);
  p.legL.knee.rotation.set(0,0,0); p.legR.knee.rotation.set(0,0,0);
  p.armL.shoulder.rotation.set(0,0,0); p.armR.shoulder.rotation.set(0,0,0);
  p.armL.elbow.rotation.set(0,0,0); p.armR.elbow.rotation.set(0,0,0);
  p.headG.position.y=p.headY; p.headG.rotation.set(0,0,0);

  if(slide){
    // 下滑：单膝跪滑 + 另一腿前伸，身体后仰、头抬起、手臂后拉，像图片里的滑行动作
    p.rig.position.y=-.400;
    p.rig.rotation.x=-.26; p.rig.rotation.y=.24;
    p.legL.hip.rotation.x=1.22; p.legL.knee.rotation.x=-.16; p.legL.hip.rotation.z=.20;
    p.legR.hip.rotation.x=-.30; p.legR.knee.rotation.x=-2.15;
    p.legR.hip.rotation.z=-.52;
    p.armL.shoulder.rotation.x=.12; p.armL.shoulder.rotation.z=-1.02;
    p.armL.elbow.rotation.x=.26;
    p.armR.shoulder.rotation.x=.10; p.armR.shoulder.rotation.z=1.04;
    p.armR.elbow.rotation.x=.24;
    p.headG.rotation.x=-.22; p.headG.rotation.z=-.04;
  } else if(jump){
    // 跳跃：双腿收拢，手臂向后上方
    p.legL.hip.rotation.x=1.28; p.legR.hip.rotation.x=1.10;
    p.legL.knee.rotation.x=-1.48; p.legR.knee.rotation.x=-1.30;
    p.armL.shoulder.rotation.x=.12; p.armR.shoulder.rotation.x=.12;
    p.armL.shoulder.rotation.z=-2.42; p.armR.shoulder.rotation.z=2.42;
    p.armL.elbow.rotation.x=.30; p.armR.elbow.rotation.x=.30;
    p.rig.rotation.x=-.16; p.headG.rotation.x=-.12;
  } else if(run){
    // 跑步：双腿交替，手臂反摆
    const ph=state.t*12.6;
    const sw=Math.sin(ph), sw2=Math.sin(ph+Math.PI);
    const amp=Math.min(1.12,.82+state.speed*.012);
    p.legL.hip.rotation.x=sw*.78*amp;
    p.legR.hip.rotation.x=sw2*.78*amp;
    p.legL.knee.rotation.x=-Math.max(0,sw) * .80;
    p.legR.knee.rotation.x=-Math.max(0,sw2) * .80;
    p.armL.shoulder.rotation.x=sw2*.72;
    p.armR.shoulder.rotation.x=sw*.72;
    p.armL.elbow.rotation.x=.18+Math.max(0,sw2)*.38;
    p.armR.elbow.rotation.x=.18+Math.max(0,sw)*.38;
    p.rig.position.y=Math.abs(Math.sin(ph*2))*.032;
    p.rig.rotation.z=sw*.032;
    p.rig.rotation.x=-.055;
    p.headG.rotation.z=-sw*.035;
  } else {
    // 待机轻微呼吸
    p.rig.position.y=Math.sin(t*2.1)*.012;
    p.armL.shoulder.rotation.x=-.06; p.armR.shoulder.rotation.x=.06;
    p.armL.elbow.rotation.x=.08; p.armR.elbow.rotation.x=.08;
    p.headG.rotation.z=Math.sin(t*1.6)*.018;
  }

  // 闪身：左右变道时整体侧倾（与输入方向一致）
  if(run && state.dodgeT>0){
    const k=state.dodgeT/.34;
    p.rig.rotation.z += -state.dodgeDir*.46*k;
    p.rig.position.x = state.dodgeDir*.070*k;
    p.headG.rotation.z += -state.dodgeDir*.15*k;
    p.legL.hip.rotation.x += .28*k; p.legR.hip.rotation.x -= .18*k;
  }
}

/* 多层冠簇树：不再是棒棒糖 */
function makeTree(crownColors, scale=1, jungle=false){
  const g=new THREE.Group();
  const cm=()=>crownMats[(Math.random()*crownMats.length)|0];
  const trunk=new THREE.Mesh(trunkGeo,matTrunk);
  trunk.scale.set(1.35,.85,1.35); trunk.position.y=.85; g.add(trunk);
  // 扁宽、错位、分层的多层冠簇，避免单圆球棒棒糖
  const c1=new THREE.Mesh(crownGeoA, cm()); c1.position.set(0,1.9,0); c1.scale.set(1.35,.8,1.15); g.add(c1);
  const c2=new THREE.Mesh(crownGeoB, cm()); c2.position.set(-.38,2.45,.18); c2.scale.set(.95,.75,.9); g.add(c2);
  const c3=new THREE.Mesh(crownGeoB, cm()); c3.position.set(.34,2.85,-.12); c3.scale.set(.72,.64,.7); g.add(c3);
  const c4=new THREE.Mesh(bushGeo, cm()); c4.position.set(-.2,2.15,-.3); c4.scale.setScalar(.7); g.add(c4);
  g.scale.setScalar(scale);
  return g;
}

function makeGift(){const g=new THREE.Group();
  const b=new THREE.Mesh(boxGeo,giftMat);b.scale.set(1.0,1.0,1.0);b.position.y=.5;g.add(b);
  const r1=new THREE.Mesh(boxGeo,giftMatB);r1.scale.set(.18,1.02,1.02);g.add(r1);
  const r2=new THREE.Mesh(boxGeo,giftMatB);r2.scale.set(1.02,.18,1.02);g.add(r2);
  const bow=new THREE.Mesh(new THREE.TorusGeometry(.18,.06,6,12),giftMatB);bow.position.y=1.05;g.add(bow);return g;}
function makeBar(){const g=new THREE.Group();
  const bar=new THREE.Mesh(boxGeo,barMat);bar.scale.set(1.9,.32,.18);bar.position.y=1.75;g.add(bar);
  [-1,1].forEach(s=>{const leg=new THREE.Mesh(boxGeo,legMat);leg.scale.set(.12,2.05,.12);leg.position.set(s*.85,1.0,0);g.add(leg);});return g;}
function makeWall(){const g=new THREE.Group();
  const w=new THREE.Mesh(boxGeo,wallMat);w.scale.set(1.62,1.95,.75);w.position.y=.98;g.add(w);
  const cap=new THREE.Mesh(boxGeo,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9}));cap.scale.set(1.78,.2,.86);cap.position.y=1.98;g.add(cap);return g;}
const builders={gift:makeGift,bar:makeBar,wall:makeWall};

function addObstacle(lane,z,type){const g=builders[type]();g.position.set(LANES[lane],0,z);obstacleRoot.add(g);obstacles.push({group:g,lane,z,type});}
function addCoinLine(lane,z,n){for(let i=0;i<n;i++){const m=new THREE.Mesh(starGeo,starMat);m.position.set(LANES[lane],G+.9,z-i*1.6);coinRoot.add(m);coins.push({mesh:m,lane,z:z-i*1.6});}}

function spawnRow(z){
  const order=[0,1,2].slice().sort(()=>Math.random()-.5);
  const n=Math.random()<.2?2:1;
  const blocked=order.slice(0,n);
  blocked.forEach(lane=>{const r=Math.random();const type=r<.42?'gift':r<.74?'bar':'wall';addObstacle(lane,z,type);});
  const free=order.slice(n);
  if(free.length){const l=free[Math.floor(Math.random()*free.length)];addCoinLine(l,z-2,3+Math.floor(Math.random()*3));}
}

const railGroup=new THREE.Group(); scene.add(railGroup);
function buildRails(){
  railGroup.clear();
  LANES.forEach(lx=>{
    [-0.55,0.55].forEach(off=>{
      const rail=new THREE.Mesh(railGeo,matRail);
      rail.position.set(lx+off,.08,-90); railGroup.add(rail);

    const tie=new THREE.Mesh(tieGeo,matTie);
    tie.position.set(0,.04,-140+i*8); railGroup.add(tie); tieItems.push(tie);
  }
}

function makeTrain(){
  const g=new THREE.Group();
  const carLen=3.6, carW=1.7, carH=2.3, n=3;
  for(let i=0;i<n;i++){
    const car=new THREE.Group();
    const body=new THREE.Mesh(boxGeo,matTrain); body.scale.set(carW,carH,carLen); body.position.y=1.15; car.add(body);
    const roof=new THREE.Mesh(boxGeo,matTrainRoof); roof.scale.set(carW+.12,.22,carLen+.12); roof.position.y=2.32; car.add(roof);
    [-1,1].forEach(s=>{
      for(let w=0;w<2;w++){
        const win=new THREE.Mesh(boxGeo,matTrainWin); win.scale.set(.06,.62,.9); win.position.set(s*(carW/2+.02),1.5,-.9+w*1.8); car.add(win);
      }
      const stripe=new THREE.Mesh(boxGeo,giftMatB); stripe.scale.set(.07,.16,carLen); stripe.position.set(s*(carW/2+.02),.55,0); car.add(stripe);
    });
    car.position.z=-i*(carLen+.25);
    g.add(car);
  }
  const nose=new THREE.Mesh(boxGeo,matTrainRoof); nose.scale.set(carW,.9,.18); nose.position.set(0,1.4,carLen/2); g.add(nose);
  const wind=new THREE.Mesh(boxGeo,matTrainWin); wind.scale.set(carW-.4,.6,.2); wind.position.set(0,1.7,carLen/2+.02); g.add(wind);
  [-0.5,0.5].forEach(lx=>{
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),matLampBulb);
    lamp.position.set(lx,1.0,carLen/2+.1); g.add(lamp);
  });
  return g;
}
function spawnTrain(){
  const busy=new Set(obstacles.filter(o=>o.isTrain).map(o=>o.lane));
  const free=[0,1,2].filter(l=>!busy.has(l));
  if(!free.length) return;
  const lane=free[(Math.random()*free.length)|0];
  const g=makeTrain();
  g.position.set(LANES[lane],0,-100);
  obstacleRoot.add(g);
  obstacles.push({group:g,lane,z:-100,type:'train',isTrain:true});
}

function buildProps(th){
  sideItems.forEach(g=>propRoot.remove(g)); bgItems.forEach(g=>propRoot.remove(g));
  sideItems.length=0; bgItems.length=0;
  const prop=th.prop, night=state.period==='night';
  matTrunk.color.set(th.trunk); matBush.color.set(th.bush); matRock.color.set(th.rock);
  matLampBulb.color.set(th.glow);
  matCrown1.color.set(th.crown[0]); matCrown2.color.set(th.crown[1%th.crown.length]); matCrown3.color.set(th.crown[2%th.crown.length]);

  const isMaple=prop==='maple', isCity=prop==='city';

  for(let i=0;i<8;i++){
    const g=new THREE.Group(); const side=i%2?1:-1; const z=-i*18-6;
    if(isMaple){
      const tree=makeTree(th.crown, 1.05+Math.random()*.35);
      tree.position.set(side*6.4,0,0); g.add(tree);
      const bush=new THREE.Mesh(bushGeo,matBush); bush.position.set(side*4.6,.4,0); g.add(bush);
    } else if(isCity){
      if(Math.random()<.6){
        const tree=makeTree(th.crown,.85); tree.position.set(side*5.6,0,0); g.add(tree);
      }
      const lp=new THREE.Mesh(boxGeo,matLampPole); lp.scale.set(.1,3.1,.1); lp.position.set(side*4.2,1.55,0); g.add(lp);
      const bulb=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),matLampBulb); bulb.position.set(side*3.9,3.0,0); g.add(bulb);
    } else {
      const tree=makeTree(th.crown,1.15+Math.random()*.3,true); tree.position.set(side*6.0,0,0); g.add(tree);
      const rock=new THREE.Mesh(rockGeo,matRock); rock.scale.set(1.2+Math.random(),1.0+Math.random(),1.1); rock.position.set(side*(5.0+Math.random()*2),.7,0); g.add(rock);
      const bush=new THREE.Mesh(bushGeo,matBush); bush.position.set(side*4.4,.5,0); bush.scale.set(1.2,1,1.2); g.add(bush);
    }
    g.position.z=z; propRoot.add(g); sideItems.push(g);
  }
  for(let i=0;i<8;i++){
    const side=i%2?1:-1; const z=-30-Math.random()*140;
    if(isCity){
      const h=6+Math.random()*13,w=3+Math.random()*5;
      bgMat.color.set(night?0x0d1626:0x2a3648);
      const b=new THREE.Mesh(boxGeo,bgMat);
      b.scale.set(w,h,2); b.position.set(side*(16+Math.random()*18),h/2,z);
      propRoot.add(b); bgItems.push(b);
    } else {
      bgMat.color.set(th.crown[0]);
      const r=3+Math.random()*3;
      const b=new THREE.Mesh(bushGeo,bgMat);
      b.scale.set(r*1.4,r,r*1.2); b.position.set(side*(15+Math.random()*16),r*.7,z);
      propRoot.add(b); bgItems.push(b);
    }
  }
}

  sideMat.color.set(th.side);

/* ============ 音效 ============ */
let actx=null;
function beep(freq,dur=.12){
  if(state.muted)return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),gn=actx.createGain();
    o.type='sine';o.frequency.value=freq;gn.gain.setValueAtTime(.12,actx.currentTime);
    gn.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(gn);gn.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}

  if(Math.abs(dx)>Math.abs(dy)){ if(Math.abs(dx)>28)moveLane(dx>0?1:-1); }

pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  const t=performance.now()/1000;

  if(state.phase==='run'){
    state.t+=dt;
    state.speed=16+Math.min(19,state.t*.62);
    const dz=state.speed*dt;
    const targetX=LANES[state.lane];
    state.x+=(targetX-state.x)*Math.min(1,dt*11);

    if(state.jumpY>.001||state.jumpVy>0){ state.jumpVy-=12.5*dt; state.jumpY+=state.jumpVy*dt; if(state.jumpY<=0){state.jumpY=0;state.jumpVy=0;} }
    if(state.slideT>0)state.slideT=Math.max(0,state.slideT-dt);
    if(state.dodgeT>0)state.dodgeT=Math.max(0,state.dodgeT-dt);

    placeRunner();
    const shScale=1-Math.min(.4,state.jumpY*.3);
    shadowEl.style.width=(72*shScale)+'px';
    shadowEl.style.opacity=String(1-Math.min(.6,state.jumpY*.4));

    camera.position.x=state.x*0.82;
    camera.position.y=2.30+state.jumpY*.24;
    camera.position.z=3.60;
    camera.updateMatrixWorld();
    camera.lookAt(state.x*0.7,0.98+state.jumpY*.24,-7);
    camera.fov=58+Math.min(8,(state.speed-16)*.3); camera.updateProjectionMatrix();

    groundTex.offset.y-=dz*.045;

    state.spawnAcc+=dz;
    if(state.spawnAcc>state.nextGap){ state.spawnAcc=0; state.nextGap=24+Math.random()*16-Math.min(8,state.t*.25); spawnRow(-140); }

    state.trainAcc+=dt;
    if(state.trainAcc>state.trainGap && state.scene==='metro'){
      state.trainAcc=0; state.trainGap=5+Math.random()*2; spawnTrain();
    }

    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      const v=o.isTrain?dz+15*dt:dz;
      o.group.position.z+=v; o.z+=v;
      if(o.z>(o.isTrain?4:.4)){ obstacleRoot.remove(o.group); obstacles.splice(i,1); continue; }
      if(Math.abs(o.z)<1.1&&o.lane===state.lane){
        const hit=o.type==='train'?true:o.type==='gift'?state.jumpY<1.15:o.type==='bar'?state.slideT<=0:true;
        if(hit&&!window.__run.god){ endGame(); return; }
      }
    }
    for(let i=coins.length-1;i>=0;i--){
      const c=coins[i]; c.mesh.position.z+=dz; c.z+=dz; c.mesh.rotation.y+=dt*3.2;
      if(c.z>2.6){ coinRoot.remove(c.mesh); coins.splice(i,1); continue; }
      if(Math.abs(c.z)<1.3&&c.lane===state.lane){ coinRoot.remove(c.mesh); coins.splice(i,1);
        state.coins++; state.score+=6; coinTxt.textContent=state.coins; beep(900,.08); }
    }

    tieItems.forEach(tie=>{ tie.position.z+=dz; if(tie.position.z>14)tie.position.z-=18*8; });

    const pAttr=pGeo.attributes.position;
    for(let i=0;i<PN;i++){
      let y=pAttr.getY(i)-(1.4+i%3*.5)*dt;
      if(y<0){ y=20; pAttr.setX(i,(Math.random()-.5)*40); pAttr.setZ(i,-Math.random()*160+10); }
      pAttr.setY(i,y);
    }
    pAttr.needsUpdate=true;

    sideItems.forEach(g=>{ g.position.z+=dz; if(g.position.z>16)g.position.z-=144; });
    bgItems.forEach(g=>{ g.position.z+=dz; if(g.position.z>16)g.position.z-=170; });

    state.score+=dz*1.4;
    scoreTxt.textContent=Math.floor(state.score);
    spdTxt.textContent=(state.speed/16).toFixed(1)+'x';
  }

  poseRunner(t); poseSprite(t);
  renderer.render(scene,camera);
}

function resize(){
  const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
resize();
bestTxt.textContent=state.best;
applyTheme();
animate();

window.__run={ god:false, start:startGame, endGame, state, obstacles, coins, spawnRow, addObstacle, addCoinLine, spawnTrain, LANES, G, runnerImg, charTex, runner:()=>runner3D, sprite:()=>runnerSprite, texs:()=>spriteTex,
  who:w=>{ state.who=w; spawnRunnerModel(); },
  setScene:s=>{ state.scene=s; applyTheme(); }, setPeriod:p=>{ state.period=p; applyTheme(); } };
</script>
</body>
</html>
