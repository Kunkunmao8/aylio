<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>政瞳祝福树 · 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{ --gold:#F2C14E; --gold2:#E09A2E; --ink:#F2E8D8; }
  html,body{height:100%;}
  body{
    color:var(--ink);font-family:"Songti SC","Noto Serif SC",Georgia,serif;overflow-x:hidden;
    background:radial-gradient(ellipse at 50% 12%,#122340 0%,#0a1226 55%,#050a18 100%);
  }
  .wrap{position:relative;max-width:920px;margin:0 auto;padding:26px 16px 60px;}

  header{text-align:center;padding:4px 0 18px;}
  header .kicker{font-size:12px;letter-spacing:6px;color:#7E97BC;}
  header h1{font-size:27px;letter-spacing:4px;margin:10px 0 6px;color:#FBEFD6;}
  header h1 span{color:var(--gold);}
  header p{font-size:13px;color:#9DB2D0;}
  .days{display:inline-flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:14px;padding:12px 20px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(242,193,78,.22);}
  .days b{display:block;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums;}
  .days span{font-size:11px;color:#9DB2D0;letter-spacing:1px;}

  .stage-box{
    position:relative;width:100%;max-width:560px;margin:0 auto;
    aspect-ratio:1/1.06;border-radius:24px;overflow:hidden;
    border:1px solid rgba(242,193,78,.2);
    background:linear-gradient(180deg,#0b1730 0%,#0d1b33 55%,#132a45 100%);
    box-shadow:0 30px 70px rgba(0,0,0,.5), inset 0 0 70px rgba(30,60,110,.35);
  }
  #scene{display:block;width:100%;height:100%;cursor:grab;touch-action:none;}
  #scene.dragging{cursor:grabbing;}

  .hud{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#9DB2D0;background:linear-gradient(0deg,rgba(5,10,24,.82),rgba(5,10,24,0));}
  .hud .count b{color:var(--gold);}
  .hud .tools{display:flex;gap:6px;}
  .tool{background:rgba(255,255,255,.09);border:1px solid rgba(242,193,78,.28);color:#E7D9BC;border-radius:999px;padding:5px 11px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:.2s;}
  .tool:hover{background:rgba(242,193,78,.22);color:#fff;}
  .tool.on{background:rgba(242,193,78,.3);border-color:var(--gold);color:#FFEFCF;}

  .stage-top{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:11.5px;color:#8FA6C8;pointer-events:none;}
  .hint-drag{opacity:.9;}

  .panel{
    max-width:560px;margin:18px auto 0;background:rgba(255,255,255,.045);border:1px solid rgba(242,193,78,.2);
    border-radius:20px;padding:18px 16px;
  }
  .panel .row{display:flex;gap:10px;flex-wrap:wrap;}
  .panel input{
    padding:12px 14px;border-radius:12px;border:1px solid rgba(242,193,78,.28);
    background:rgba(255,255,255,.08);color:var(--ink);font-family:inherit;font-size:14px;outline:none;
  }
  .panel input:focus{border-color:var(--gold);}
  .panel input::placeholder{color:#7E93B4;}
  .panel input.name{flex:0 0 108px;}
  .panel input.text{flex:1 1 180px;min-width:150px;}
  .btn{padding:12px 22px;border-radius:999px;border:1px solid var(--gold);background:var(--gold);color:#3A2408;font-size:14px;letter-spacing:1px;cursor:pointer;font-family:inherit;font-weight:700;transition:.2s;white-space:nowrap;}
  .btn:hover{background:var(--gold2);border-color:var(--gold2);color:#fff;}
  .panel .tip{font-size:12px;color:#8FA6C8;margin-top:10px;text-align:center;}

  footer{text-align:center;margin-top:26px;font-size:11.5px;color:#63799B;letter-spacing:1px;}

  /* 详情浮层 */
  .note-view{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(4,8,20,.72);backdrop-filter:blur(5px);}
  .note-view.show{display:flex;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .note-box{width:100%;max-width:320px;border-radius:20px;padding:24px 22px 18px;position:relative;
    background:linear-gradient(160deg,#fff4e2,#f7e0a8 55%,#eec46e);border:1px solid var(--gold);
    box-shadow:0 0 44px rgba(242,193,78,.42),0 24px 60px rgba(0,0,0,.45);animation:popin .38s cubic-bezier(.2,1.3,.4,1);}
  @keyframes popin{from{transform:scale(.75);opacity:0;}to{transform:scale(1);opacity:1;}}
  .note-box .nv-name{font-size:13px;color:#8A5A12;letter-spacing:1px;margin-bottom:9px;}
  .note-box .nv-text{font-size:16px;line-height:1.8;color:#4A2E08;word-break:break-word;}
  .note-box .nv-time{font-size:10.5px;color:#A98444;margin-top:12px;}
  .note-box .nv-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:14px;}
  .nv-del{background:none;border:1px solid #C99A3E;color:#8A5A12;border-radius:999px;padding:7px 15px;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .nv-del:hover{background:rgba(201,154,62,.16);}
  .nv-close{background:#E09A2E;border:1px solid #E09A2E;color:#fff;border-radius:999px;padding:7px 18px;font-size:12.5px;cursor:pointer;font-family:inherit;}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#9DB2D0;font-size:13px;z-index:9;background:linear-gradient(180deg,#0b1730,#132a45);}
  .loading .spin{width:26px;height:26px;border-radius:50%;border:2px solid rgba(242,193,78,.35);border-top-color:var(--gold);animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .loading.hide{display:none;}

  @media (max-width: 520px){
    .wrap{padding:18px 12px 40px;}
    header h1{font-size:23px;letter-spacing:3px;}
    header p{font-size:12px;}
    .days{gap:10px;padding:10px 14px;border-radius:14px;}
    .days b{font-size:18px;}
    .hint-drag{font-size:10px;}
    .stage-top{font-size:10px;}
    .hud{padding:8px 11px;font-size:11px;}
    .tool{padding:4px 9px;font-size:10.5px;}
    .panel{padding:14px 12px;border-radius:16px;}
    .panel .row{flex-direction:column;gap:8px;}
    .panel input.name,.panel input.text{flex:1 1 auto;width:100%;min-width:0;}
    .btn{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">AYLIO · 政在瞳行</div>
    <h1>政瞳<span>祝福树</span></h1>
    <p>每句祝福变成一只小枕头，挂上这棵会转的立体圣诞树</p>
    <div class="days">
      <div class="d"><b id="dayD">0</b><span>天</span></div>
      <div class="d"><b id="dayH">0</b><span>时</span></div>
      <div class="d"><b id="dayM">0</b><span>分</span></div>
      <div class="d"><b id="dayS">0</b><span>秒</span></div>
    </div>
  </header>

  <div class="stage-box" id="stageBox">
    <canvas id="scene"></canvas>
    <div class="stage-top">
      <span class="hint-drag">拖拽旋转 · 上下翻转 · 滚轮缩放</span>
    </div>
    <div class="hud">
      <span class="count">已挂 <b id="countTxt">0</b> 只</span>
      <div class="tools">
        <button class="tool" id="btnReset">重置视角</button>
        <button class="tool on" id="btnSpin">自动旋转</button>
      </div>
    </div>
    <div class="loading" id="loading"><div class="spin"></div><span>正在点亮圣诞树…</span></div>
  </div>

  <div class="panel">
    <div class="row">
      <input class="name" id="noteName" placeholder="你的昵称" maxlength="12" />
      <input class="text" id="noteText" placeholder="写一句祝福，挂到树上…" maxlength="60" />
      <button class="btn" id="noteSend">挂上树 🎄</button>
    </div>
    <div class="tip" id="tipTxt">提示：点树上的小枕头可以看完整祝福</div>
  </div>

  <footer>© 2026 政瞳之家 · 仅作粉丝纪念，图片版权归原作者所有</footer>
</div>

<div class="note-view" id="noteView">
  <div class="note-box">
    <div class="nv-name" id="nvName"></div>
    <div class="nv-text" id="nvText"></div>
    <div class="nv-time" id="nvTime"></div>
    <div class="nv-actions">
      <button class="nv-del" id="nvDel">摘下这只</button>
      <button class="nv-close" id="nvClose">收好</button>
    </div>
  </div>
</div>

/* ---- 针叶：成千上万个密集针簇，长出蓬松的真实轮廓 ---- */
function needleTexture(){
  const S = 256;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.clearRect(0,0,S,S);
  const cx = S*0.5, baseY = S*0.985, topY = S*0.05;

  // 主枝干
  g.lineCap = 'round';
  g.strokeStyle = 'hsl(104,30%,16%)';
  for(let i=0;i<3;i++){
    g.lineWidth = 4.5 - i;
    g.beginPath();
    g.moveTo(cx + (Math.random()-0.5)*5, baseY);
    g.quadraticCurveTo(cx + (Math.random()-0.5)*12, (baseY+topY)/2, cx + (Math.random()-0.5)*8, topY);
    g.stroke();
  }

  // 两侧细针：自下而上逐排外斜，羽状
  const pairs = 32;
  for(let i=0;i<pairs;i++){
    const t = i/(pairs-1);
    const y0 = baseY - t*(baseY-topY)*0.97;
    const len = (0.34 - 0.17*t) * S;
    [-1,1].forEach(sd=>{
      for(let k=0;k<3;k++){
        const jitter = (Math.random()-0.5)*10;
        const x0 = cx + sd*5;
        const sy = y0 + (k-1)*8 + jitter*0.4;
        const x1 = x0 + sd*len*(0.72 + Math.random()*0.4);
        const y1 = sy - len*(0.30 + Math.random()*0.34);
        const hue = 96 + Math.random()*24;
        const light = 14 + Math.random()*18 + (t*6);
        g.strokeStyle = `hsl(${hue},${38+Math.random()*14}%,${light}%)`;
        g.lineWidth = 1.5 + Math.random()*1.3;
        g.beginPath();
        g.moveTo(x0, sy);
        g.quadraticCurveTo(x0 + sd*len*0.35, sy - len*0.06, x1, y1);
        g.stroke();
      }
    });
  }
  // 顶部嫩针
  for(let i=0;i<10;i++){
    const sd = i%2 ? 1 : -1;
    g.strokeStyle = `hsl(${104+Math.random()*16},${44+Math.random()*12}%,${30+Math.random()*12}%)`;
    g.lineWidth = 1.3;
    g.beginPath();
    g.moveTo(cx, topY + Math.random()*S*0.12);
    g.lineTo(cx + sd*(S*0.03+Math.random()*S*0.05), topY - Math.random()*S*0.04);
    g.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

const _m4 = new THREE.Matrix4(), _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion();
const _pos = new THREE.Vector3(), _scl = new THREE.Vector3(), _n = new THREE.Vector3();
const _zAxis = new THREE.Vector3(0,0,1), _tan = new THREE.Vector3();
const _col = new THREE.Color();

for(let i=0;i<NEEDLE_N;i++){
  // 按面积采样：下部更密
  // 分层的枝盘：每层外缘密、层间留台阶，形成松树特有的层叠轮廓
  const LY = 17;
  const li = Math.min(LY-1, Math.floor(Math.pow(Math.random(), 0.55)*LY));
  const yBase = 0.7 + (li/LY)*(TREE_H*0.93);
  const LH = (TREE_H*0.93)/LY;
  const y = yBase + Math.pow(Math.random(), 0.7)*(LH*0.95);
  const ang = Math.random()*Math.PI*2;
  // 越靠层底越往外伸（枝条下垂），层顶收进去
  const drop = (y - yBase)/LH;
  const r = radiusAtY(yBase) * (1.02 - drop*0.26) * (0.86 + Math.random()*0.26);
  const edgeFade = Math.min(1, (y - 0.7)/1.1);   // 贴地两排收窄，别伸到雪地上
  const rr = r * (0.72 + 0.28*edgeFade);
  _pos.set(Math.cos(ang)*rr, y, Math.sin(ang)*rr);

  // 法线朝外并略向上，让针叶顺着枝向外长
  _n.set(Math.cos(ang), 0.10 + Math.random()*0.5, Math.sin(ang)).normalize();
  // 随机倾斜，让针叶朝向杂乱，任何角度看都不会变薄
  _tan.set(-Math.sin(ang), 0.32, Math.cos(ang)).normalize();
  _n.applyAxisAngle(_tan, (Math.random()*0.9 - 0.45));
  _n.normalize();
  _q1.setFromUnitVectors(_zAxis, _n);
  _q2.setFromAxisAngle(_n, Math.random()*Math.PI*2);
  _q1.multiply(_q2);

  const sc = (0.38 + Math.random()*0.34) * (1 - (y/TREE_H)*0.16);
  _scl.set(sc, sc, sc);
  _m4.compose(_pos, _q1, _scl);
  needleMesh.setMatrixAt(i, _m4);

  // 深浅不一的绿，暗部更沉、亮部更翠
  const shade = 0.42 + Math.random()*0.72;
  _col.setRGB(0.13*shade + 0.05, 0.53*shade + 0.10, 0.21*shade + 0.06);
  needleMesh.setColorAt(i, _col);
}

const CAM_TARGET = new THREE.Vector3(0, 5.6, 0);
const CAM_DIST0 = Math.min(innerWidth, innerHeight*1.1) < 520 ? 21 : 26;
let camTheta = 0.42, camPhi = 1.22, camDist = CAM_DIST0;
const PHI_MIN = 0.5, PHI_MAX = 1.74, DIST_MIN = 12, DIST_MAX = 40;

function applyCamera(){
  camera.position.set(
    camDist*Math.sin(camPhi)*Math.sin(camTheta),
    camDist*Math.cos(camPhi) + CAM_TARGET.y,
    camDist*Math.sin(camPhi)*Math.cos(camTheta)
  );
  camera.lookAt(CAM_TARGET);
}
applyCamera();

let autoSpin = true;
let dragging = false, lastX = 0, lastY = 0, movedDist = 0;
const pointers = new Map();
let pinchStart = 0, pinchDist0 = 0;

function onDown(e){
  canvas.setPointerCapture?.(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1){
    dragging = true; movedDist = 0;
    lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('dragging');
  } else if(pointers.size === 2){
    const pts = [...pointers.values()];
    pinchDist0 = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    pinchStart = camDist;
  }
}
function onMove(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pointers.size === 2){
    const pts = [...pointers.values()];
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(pinchDist0 > 10){
      camDist = Math.max(DIST_MIN, Math.min(DIST_MAX, pinchStart * (pinchDist0/d)));
      applyCamera();
    }
    movedDist += 20;
    return;
  }
  if(!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  movedDist += Math.abs(dx) + Math.abs(dy);
  camTheta -= dx * 0.0075;
  camPhi = Math.max(PHI_MIN, Math.min(PHI_MAX, camPhi - dy * 0.0055));
  applyCamera();
}
function onUp(e){
  pointers.delete(e.pointerId);
  if(pointers.size === 0){ dragging = false; canvas.classList.remove('dragging'); }
  if(pointers.size === 1){ const p=[...pointers.values()][0]; lastX=p.x; lastY=p.y; }
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  camDist = Math.max(DIST_MIN, Math.min(DIST_MAX, camDist + e.deltaY*0.02));
  applyCamera();
}, {passive:false});

  // 只露出枕头的上半小角，下半藏进树叶里

      (S-iw)/2, S*0.10, iw, ih*0.58);
  }else{

    g.beginPath(); g.roundRect(S*0.14,S*0.12,S*0.72,S*0.42,S*0.14); g.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  texCache.set(key, tex);
  return tex;
}

const GOLDEN = Math.PI * (3 - Math.sqrt(5));
function slotPos(i, n){
  // 黄金角散点：均匀铺满整棵树的表面，不形成规则斜带
  const t = n === 1 ? 0.5 : (i + 0.5) / n;
  const u = (1 - Math.sqrt(1 - t)) * 0.9;   // 按树冠面积分布：下密上疏，顶部留给星
  const y = 1.25 + u*(TREE_H*0.86) + (Math.random()-0.5)*0.26;
  const ang = i*GOLDEN + (Math.random()-0.5)*0.12;
  const depth = 0.93 + Math.random()*0.3;        // 有的靠里有的靠外，形成前后层次
  const rad = radiusAtY(y) * depth + 0.1;
  return new THREE.Vector3(Math.cos(ang)*rad, y, Math.sin(ang)*rad);
}

  notes.forEach((note, i)=>{
    const name = (note.name || '小枕头').slice(0,4);
    const tex = cardTexture(name);
    const mat = new THREE.SpriteMaterial({
      map: tex, transparent: true, alphaTest: 0.25, depthWrite: true, depthTest: true,
      toneMapped: false, fog: false, color: 0xffffff
    });
    mat.rotation = (Math.random()-0.5)*0.22;
    const sp = new THREE.Sprite(mat);
    const base = slotPos(i, n);
    // 牌越多越小，避免把树糊成一片橘色
    const dense = Math.max(0, Math.min(1, (n - 40)/160));
    const s0 = 0.52 - dense*0.18;
    const s = s0 * (0.94 + Math.random()*0.12);
    sp.scale.set(s, s*0.86, 1);
    sp.position.copy(base);
    sp.userData.note = note;
    sp.userData.base = base.clone();
    sp.userData.ph = Math.random()*6.28;
    sp.userData.born = isNew && i === n-1 ? performance.now() : 0;

    cardLayer.add(sp);
    cardObjs.push({sprite: sp, note, base, ph: sp.userData.ph, dropped: sp.userData.born > 0});
  });
}

/* 存储 */
const DEMO_N = parseInt(new URLSearchParams(location.search).get('demo') || '0', 10);
const DEMO_NAMES = ['小枕头','瞳瞳','政哥','阿柚','橘子','林小满','南风','糖霜','白桃','小猫','山楂','雨衣','小鹿','半夏','青柠','阿眠','橘子汽水','木木'];
const DEMO_TEXTS = ['要一直在一起呀','愿你们被温柔以待','真诚的人值得最好的','下一年也要一起过','雪天记得吃热饺子','生日快乐，永远开心','谢谢你们出现在这里','慢慢来，我们都等得起','每天都要顺顺利利','爱意不会减少一点点'];
let DEMO = null;
if(DEMO_N > 0){
  DEMO = Array.from({length: Math.min(DEMO_N, MAX_CARDS)}, (_, i)=>({
    name: DEMO_NAMES[i % DEMO_NAMES.length],
    text: DEMO_TEXTS[i % DEMO_TEXTS.length],
    ts: 1763000000000 - i*3600000
  }));
}
function loadWall(){
  if(DEMO) return DEMO.slice();
  try{ const a = JSON.parse(localStorage.getItem(WALL_KEY)) || []; return a.filter(x=>x&&x.text); }
  catch(e){ return []; }
}
function saveWall(arr){
  if(DEMO){ DEMO = arr.slice(); return; }
  localStorage.setItem(WALL_KEY, JSON.stringify(arr));
}

/* 点击卡片 */
let downPos = null;
canvas.addEventListener('pointerdown', e=>{ downPos = {x:e.clientX, y:e.clientY, t:Date.now()}; });
canvas.addEventListener('pointerup', e=>{
  if(!downPos) return;
  const moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
  const dt = Date.now()-downPos.t;
  downPos = null;
  if(moved > 8 || dt > 900) return;      // 拖拽或长按不算点击

  const rect = canvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((e.clientX-rect.left)/rect.width)*2 - 1,
    -((e.clientY-rect.top)/rect.height)*2 + 1
  );
  raycaster.camera = camera;              // Sprite 被点选必须绑定相机
  camera.updateMatrixWorld();             // 确保相机/节点矩阵是最新的
  scene.updateMatrixWorld(true);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(cardLayer.children, false);
  if(hits.length){
    openNote(hits[0].object.userData.note);
  }
});

/* ============ 详情浮层 ============ */
const noteView = document.getElementById('noteView');
const nvName = document.getElementById('nvName'), nvText = document.getElementById('nvText'),
      nvTime = document.getElementById('nvTime'), nvDel = document.getElementById('nvDel'),
      nvClose = document.getElementById('nvClose');
let currentNote = null;

function openNote(n){
  if(!n) return;
  currentNote = n;
  nvName.textContent = '@' + (n.name || '小枕头');
  nvText.textContent = n.text;
  nvTime.textContent = n.ts ? new Date(n.ts).toLocaleString('zh-CN',{hour12:false}) : '';
  noteView.classList.add('show');
}
nvClose.onclick = ()=> noteView.classList.remove('show');
noteView.addEventListener('click', e=>{ if(e.target === noteView) noteView.classList.remove('show'); });
nvDel.onclick = ()=>{
  if(!currentNote) return;
  const arr = loadWall().filter(x=>x.ts !== currentNote.ts);
  saveWall(arr);
  buildCards(false);
  noteView.classList.remove('show');
};

/* ============ 提交 ============ */
const noteName = document.getElementById('noteName'), noteText = document.getElementById('noteText'),
      noteSend = document.getElementById('noteSend'), tipTxt = document.getElementById('tipTxt');

noteSend.onclick = ()=>{
  const txt = noteText.value.trim();
  if(!txt){ noteText.focus(); return; }
  const arr = loadWall();
  arr.unshift({name: noteName.value.trim() || '小枕头', text: txt, ts: Date.now()});
  saveWall(arr);
  buildCards(true);
  noteText.value = '';
  tipTxt.textContent = '已挂上树，可以拖一下树看看 :)';
};
noteText.addEventListener('keydown', e=>{ if(e.key === 'Enter') noteSend.click(); });

buildCards(false);
if(renderer) document.getElementById('loading').classList.add('hide');

/* 对外状态（也方便二次开发接小程序/其他页面） */
window.__tree3d = {
  THREE, scene, camera, treeGroup,
  state: ()=>({theta:camTheta, phi:camPhi, dist:camDist, cards:cardObjs.length, autoSpin}),
  setView: (th, ph, dist)=>{ camTheta=th; if(ph) camPhi=ph; if(dist) camDist=dist; applyCamera(); },
  cardScreenPos: (i)=>{
    const o = cardObjs[i]; if(!o) return null;
    const v = o.sprite.position.clone().project(camera);
    const r = canvas.getBoundingClientRect();
    return {x: r.left + (v.x+1)/2*r.width, y: r.top + (-v.y+1)/2*r.height};
  },
  openNote: (i)=>{ if(cardObjs[i]) openNote(cardObjs[i].note); }
};

/* ============ 渲染循环 ============ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const now = performance.now();

  if(autoSpin && !dragging) { camTheta += 0.0022; applyCamera(); }

  // 树轻轻摇摆 + 装饰球呼吸
  treeGroup.rotation.y = Math.sin(t*0.16)*0.035;

  ballList.forEach(b=>{
    const k = 1 + 0.05*Math.sin(t*1.4 + b.ph);
    b.mesh.scale.setScalar(b.base*k);
  });
  bulbs.forEach(b=>{
    const a = 0.55 + 0.45*Math.sin(t*2.6 + b.ph);
    b.mesh.material.color.setRGB(1, 0.68 + a*0.1, 0.24 + a*0.2);
  });

  // 顶星旋转与光晕呼吸
  star.quaternion.copy(camera.quaternion);
  const pulse = 1 + 0.10*Math.sin(t*1.6);
  starGlow.scale.set(4.0*pulse, 4.0*pulse, 1);
  starGlow.material.opacity = 0.85 + 0.15*Math.sin(t*1.6);

  // 卡片：轻微摆动 + 新卡掉落
  cardObjs.forEach(o=>{
    o.sprite.position.x = o.base.x + Math.sin(t*1.1 + o.ph)*0.05;
    o.sprite.position.z = o.base.z + Math.cos(t*0.9 + o.ph)*0.05;
    if(o.dropped){
      const dt = (now - o.sprite.userData.born) / 1000;
      const e = Math.min(1, dt/1.0);
      const ease = 1 - Math.pow(1-e, 3);
      o.sprite.position.y = o.base.y + (1-ease)*9;
      o.sprite.scale.setScalar(0.7 + 0.3*ease);
      if(e >= 1){ o.dropped = false; o.sprite.userData.born = 0; o.sprite.scale.set(1,1,1); }
    }
  });

  // 雪
  const posAttr = snowGeo.attributes.position;
  for(let i=0;i<SNOW_N;i++){
    let y = posAttr.getY(i) - 0.055;
    let x = posAttr.getX(i) + Math.sin(t*0.5 + i)*0.006;
    if(y < 0){ y = 18; x = (Math.random()*32-16); posAttr.setZ(i, Math.random()*32-16); }
    posAttr.setY(i, y);
    posAttr.setX(i, x);
  }
  posAttr.needsUpdate = true;

  if(renderer) renderer.render(scene, camera);
}
resize();
animate();

addEventListener('resize', ()=>{ resize(); });
</script>
