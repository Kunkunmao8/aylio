<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>政瞳跑酷 · 活力冲刺</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{ --gold:#F2C14E; --gold2:#E09A2E; --orange:#FF8A3C; --ink:#3A241A; --cream:#FFF3E2; }
  html,body{height:100%;overflow:hidden;}
  body{ color:var(--cream);font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;background:#14101f; }
  .app{position:relative;width:100%;height:100%;overflow:hidden;}
  #scene{display:block;width:100%;height:100%;touch-action:none;}

  /* ===== 顶部 HUD ===== */
  .hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;}
  .hud .score{font-size:26px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);font-variant-numeric:tabular-nums;}
  .hud .score small{font-size:11px;color:#cdd9ec;letter-spacing:2px;display:block;font-weight:500;}
  .hud .right{text-align:right;font-size:12px;color:#c2d0e6;line-height:1.7;text-shadow:0 1px 6px rgba(0,0,0,.5);}
  .hud .right b{color:var(--gold);font-variant-numeric:tabular-nums;}
  .coinbar{position:absolute;top:70px;left:16px;display:flex;align-items:center;gap:6px;font-size:13px;color:#FFD98A;z-index:5;text-shadow:0 1px 6px rgba(0,0,0,.5);}

  /* ===== 触屏按键 ===== */
  .pad{position:absolute;left:0;right:0;bottom:18px;z-index:6;display:none;justify-content:space-between;padding:0 18px;pointer-events:none;}
  .pad.show{display:flex;}
  .pad .side{display:flex;gap:12px;pointer-events:auto;}
  .pad button{width:62px;height:62px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(18,24,40,.55);color:#fff;font-size:20px;font-family:inherit;backdrop-filter:blur(4px);cursor:pointer;user-select:none;}
  .pad button:active{background:rgba(242,193,78,.4);transform:scale(.93);}
  .pad .mid{display:flex;gap:12px;pointer-events:auto;}
  .pad button.small{font-size:14px;}

  .runner-img{position:absolute;left:0;top:0;z-index:3;width:112px;pointer-events:none;
    transform-origin:center bottom;filter:drop-shadow(0 0 7px rgba(255,255,255,.28)) drop-shadow(0 6px 8px rgba(0,0,0,.35));will-change:transform;}
  .runner-shadow{position:absolute;left:0;top:0;z-index:2;width:72px;height:18px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.42),rgba(0,0,0,0));pointer-events:none;will-change:transform;}

  .flash{position:absolute;inset:0;background:rgba(255,60,60,.32);opacity:0;transition:opacity .18s;z-index:7;pointer-events:none;}
  footer{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10.5px;color:rgba(255,255,255,.4);letter-spacing:1px;z-index:4;}

  /* ===== 启动遮罩 ===== */
  .overlay{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;overflow:hidden;
    background:linear-gradient(150deg,#ffb53a 0%,#ff8a3c 45%,#ff6b5e 100%);}
  .overlay.hide{display:none;}
  .overlay::before{content:"";position:absolute;inset:0;background:
    radial-gradient(circle at 18% 22%,rgba(255,255,255,.22),transparent 26%),
    radial-gradient(circle at 85% 18%,rgba(255,255,255,.18),transparent 22%),
    radial-gradient(circle at 80% 82%,rgba(255,120,80,.35),transparent 30%);}

  .deco{position:absolute;pointer-events:none;opacity:.7;}
  .tri{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:24px solid #fff;}
  .tri.b{border-bottom-color:#ffe08a;}
  .circ{width:18px;height:18px;border-radius:50%;background:#fff;}
  .circ.g{background:#ffe08a;}
  .sq{width:20px;height:20px;border-radius:5px;background:#fff;transform:rotate(24deg);}
  .star{color:#fff;font-size:22px;line-height:1;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(14deg)}}
  @keyframes floaty2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(12px) rotate(-12deg)}}

  .topbar{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:auto;}
  .topbar .grp{display:flex;gap:18px;font-size:11px;color:rgba(255,255,255,.9);letter-spacing:1px;}
  .topbar .ic{display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.95;}
  .topbar .ic .dot{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:14px;}
  .ic-btn{cursor:pointer;transition:.15s;}
  .ic-btn:active{transform:scale(.9);}
  .ic-btn .dot{background:rgba(255,255,255,.3);}

  /* 通用弹层 */
  .modal-mask{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,14,26,.55);backdrop-filter:blur(3px);padding:24px;}
  .modal-mask.show{display:flex;}
  .modal-card{width:min(330px,90%);background:#fff;border-radius:24px;padding:20px 18px;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .28s cubic-bezier(.2,1.4,.4,1);color:var(--ink);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .modal-head span{font-size:17px;font-weight:800;}
  .modal-x{width:30px;height:30px;border:none;border-radius:50%;background:#f2e2d2;color:var(--ink);font-size:18px;cursor:pointer;line-height:1;}
  .modal-body{font-size:13px;color:#5a4a3a;line-height:1.7;}
  .mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0e4d6;}
  .mrow:last-child{border-bottom:none;}
  .switch{width:46px;height:26px;border-radius:999px;background:#d8c8b8;position:relative;cursor:pointer;transition:.2s;}
  .switch.on{background:var(--gold2);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch.on::after{left:23px;}
  .mbtn{margin-top:12px;width:100%;padding:11px;border:none;border-radius:14px;background:var(--gold);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
  .mbtn.ghost{background:#f2e2d2;color:var(--ink);}
  .mnote{background:#fff6ea;border-radius:14px;padding:12px;margin-top:6px;font-size:12.5px;color:#7a6248;}
  .mstat{display:flex;gap:10px;margin-top:8px;}
  .mstat .box{flex:1;background:#fff6ea;border-radius:14px;padding:10px;text-align:center;}
  .mstat .box b{display:block;font-size:18px;color:var(--gold2);}


  /* 双人横幅 */
  .duo-banner{position:relative;z-index:2;width:230px;margin:6px 0 2px;}
  .duo-banner img{width:100%;display:block;filter:drop-shadow(0 8px 14px rgba(150,50,10,.3));}

  .duo{position:relative;display:flex;gap:16px;margin:4px 0 4px;z-index:2;}
  .rcard{width:104px;padding:8px 6px 10px;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 10px 24px rgba(180,70,20,.35);cursor:pointer;transition:.22s;border:2.5px solid transparent;}
  .rcard img{width:76px;max-height:84px;object-fit:contain;display:block;margin:0 auto 4px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.25));}
  .rcard .nm{font-size:13px;font-weight:700;color:var(--ink);}
  .rcard .tg{display:block;font-size:10px;color:#a6724a;margin-top:2px;}
  .rcard.on{border-color:var(--gold);transform:translateY(-6px) scale(1.03);box-shadow:0 14px 30px rgba(180,70,20,.45);}

  .title{position:relative;z-index:2;margin:2px 0 2px;}
  .title h1{font-size:36px;font-weight:900;letter-spacing:4px;color:#fff;
    text-shadow:0 2px 0 #c85a20,0 4px 0 #c85a20,0 6px 0 rgba(150,50,10,.55),3px 4px 0 rgba(150,50,10,.25);
    transform:rotate(-2deg);}
  .title h1 span{color:#ffe08a;}
  .title .sub{font-size:12px;color:rgba(255,255,255,.92);letter-spacing:3px;margin-top:2px;}

  .opts{position:relative;z-index:2;margin:14px 0 4px;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .opts .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .opt{padding:8px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);color:#fff;font-size:13px;cursor:pointer;font-family:inherit;transition:.18s;}
  .opt.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(150,50,10,.3);}

  .btn{position:relative;z-index:2;margin-top:18px;padding:14px 44px;border-radius:999px;border:none;background:#fff;color:var(--ink);font-size:16px;letter-spacing:3px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 8px 0 #d97a28,0 14px 22px rgba(150,50,10,.35);transition:.16s;}
  .btn:active{transform:translateY(5px);box-shadow:0 3px 0 #d97a28,0 6px 12px rgba(150,50,10,.3);}
  .btn.ghost{background:rgba(255,255,255,.2);color:#fff;box-shadow:0 5px 0 rgba(150,50,10,.35);margin-left:10px;}

  .keys{position:relative;z-index:2;margin-top:14px;font-size:11.5px;color:rgba(255,255,255,.85);line-height:1.9;}
  .keys kbd{display:inline-block;padding:1px 7px;border-radius:5px;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.3);font-size:11px;margin:0 2px;}

  /* ===== 结算卡片 ===== */
  .result-mask{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(10,14,26,.55);backdrop-filter:blur(3px);}
  .result-mask.show{display:flex;}
  .result-card{width:min(320px,84%);background:#fff;border-radius:26px;padding:26px 22px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,1.4,.4,1);}
  @keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .result-card .tag{font-size:12px;letter-spacing:3px;color:#a6724a;font-weight:600;}
  .result-card .big{font-size:46px;color:var(--ink);font-weight:900;margin:6px 0;font-variant-numeric:tabular-nums;}
  .result-card .row{font-size:13px;color:#6a5a4a;margin-top:6px;}
  .result-card .row b{color:var(--gold2);}
  .result-card .actions{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .result-card .btn{margin-top:0;padding:11px 18px;font-size:14px;box-shadow:0 6px 0 #d97a28,0 10px 16px rgba(150,50,10,.3);}
  .result-card .btn.ghost{background:#f2e2d2;color:var(--ink);box-shadow:0 4px 0 #d8b89a;}
.engine-fail{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;max-width:330px;padding:24px 22px;border-radius:22px;background:rgba(255,250,242,.96);color:#4A2E21;box-shadow:0 20px 50px rgba(70,30,10,.24);font-size:14px;line-height:1.7;}
.engine-fail b{font-size:18px;letter-spacing:1px;}
.engine-fail span{font-size:13px;color:#7A5744;}
</style>
</head>
<body>
<div class="app">
  <canvas id="scene"></canvas>
  <div class="runner-shadow" id="runnerShadow"></div>
  <img id="runnerImg" class="runner-img" alt="runner" />

  <div class="hud">
    <div class="score"><small>SCORE</small><span id="scoreTxt">0</span></div>
    <div class="right">最高 <b id="bestTxt">0</b><br />速度 <b id="spdTxt">1.0x</b></div>
  </div>
  <div class="coinbar">⭐ <span id="coinTxt">0</span></div>

  <div class="pad" id="pad">
    <div class="side">
      <button id="btnL">←</button>
      <button id="btnR">→</button>
    </div>
    <div class="mid">
      <button id="btnUp" class="small">跳</button>
      <button id="btnDown" class="small">滑</button>
    </div>
  </div>

  <div class="flash" id="flash"></div>

  <!-- 启动遮罩 -->
  <div class="overlay" id="startOverlay">
    <div class="topbar">
      <div class="grp">
        <div class="ic ic-btn" id="btnSetting"><div class="dot">⚙</div><span>设置</span></div>
        <div class="ic ic-btn" id="btnSound"><div class="dot" id="soundIcon">🔊</div><span id="soundLabel">声音</span></div>
      </div>
      <div class="grp">
        <div class="ic ic-btn" id="btnAccount"><div class="dot">👤</div><span>账号</span></div>
        <div class="ic ic-btn" id="btnNotice"><div class="dot">📢</div><span>公告</span></div>
      </div>
    </div>

    <div class="modal-mask" id="modalMask">
      <div class="modal-card">
        <div class="modal-head"><span id="modalTitle">设置</span><button class="modal-x" id="modalClose">×</button></div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <div class="deco tri b" style="top:18%;left:10%;animation:floaty 3.2s ease-in-out infinite;"></div>
    <div class="deco circ" style="top:30%;left:82%;animation:floaty2 3.8s ease-in-out infinite;"></div>
    <div class="deco sq" style="top:64%;left:8%;animation:floaty 4s ease-in-out infinite;"></div>

function groundTexture(prop, lineColor){
  const c = document.createElement('canvas'); c.width=256; c.height=512;
  const g = c.getContext('2d');
  if(prop==='city'){
    g.fillStyle='#3c4046'; g.fillRect(0,0,256,512);
    for(let i=0;i<900;i++){ g.fillStyle=`rgba(${Math.random()<.5?20:90},${Math.random()<.5?20:90},${Math.random()<.5?24:96},.25)`; g.fillRect(Math.random()*256,Math.random()*512,1.4,1.4); }
    g.fillStyle=lineColor; g.fillRect(14,0,5,512); g.fillRect(237,0,5,512);
    g.globalAlpha=.85; [85,171].forEach(x=>{ for(let y=0;y<512;y+=64){ g.fillRect(x-3,y+12,6,30); } });
  } else if(prop==='maple'){
    g.fillStyle='#5d5144'; g.fillRect(0,0,256,512);
    for(let i=0;i<1100;i++){ const v=60+Math.random()*70|0; g.fillStyle=`rgba(${v},${v-12},${v-24},.55)`; g.beginPath(); g.arc(Math.random()*256,Math.random()*512,1+Math.random()*1.6,0,7); g.fill(); }
  } else {
    g.fillStyle='#a8835a'; g.fillRect(0,0,256,512);
    for(let i=0;i<900;i++){ const v=120+Math.random()*60|0; g.fillStyle=`rgba(${v},${v-30},${v-58},.3)`; g.fillRect(Math.random()*256,Math.random()*512,1.6,1.6); }
    g.globalAlpha=.5; g.fillStyle=lineColor;
    [85,171].forEach(x=>{ for(let y=0;y<512;y+=72){ g.fillRect(x-2,y+14,4,26); } });
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1,14);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

/* 多层冠簇树：不再是棒棒糖 */
function makeTree(crownColors, scale=1, jungle=false){
  const g=new THREE.Group();
  const cm=()=>crownMats[(Math.random()*crownMats.length)|0];
  const trunk=new THREE.Mesh(trunkGeo,matTrunk);
  trunk.scale.set(1.35,.85,1.35); trunk.position.y=.85; g.add(trunk);
  // 扁宽、错位、分层的多层冠簇，避免单圆球棒棒糖
  const c1=new THREE.Mesh(crownGeoA, cm()); c1.position.set(0,1.9,0); c1.scale.set(1.35,.8,1.15); g.add(c1);
  const c2=new THREE.Mesh(crownGeoB, cm()); c2.position.set(-.38,2.45,.18); c2.scale.set(.95,.75,.9); g.add(c2);
  const c3=new THREE.Mesh(crownGeoB, cm()); c3.position.set(.34,2.85,-.12); c3.scale.set(.72,.64,.7); g.add(c3);
  const c4=new THREE.Mesh(bushGeo, cm()); c4.position.set(-.2,2.15,-.3); c4.scale.setScalar(.7); g.add(c4);
  g.scale.setScalar(scale);
  return g;
}

function spawnRow(z){
  const order=[0,1,2].slice().sort(()=>Math.random()-.5);
  const n=Math.random()<.2?2:1;
  const blocked=order.slice(0,n);
  blocked.forEach(lane=>{const r=Math.random();const type=r<.42?'gift':r<.74?'bar':'wall';addObstacle(lane,z,type);});
  const free=order.slice(n);
  if(free.length){const l=free[Math.floor(Math.random()*free.length)];addCoinLine(l,z-2,3+Math.floor(Math.random()*3));}
}

function makeTrain(){
  const g=new THREE.Group();
  const carLen=3.6, carW=1.7, carH=2.3, n=3;
  for(let i=0;i<n;i++){
    const car=new THREE.Group();
    const body=new THREE.Mesh(boxGeo,matTrain); body.scale.set(carW,carH,carLen); body.position.y=1.15; car.add(body);
    const roof=new THREE.Mesh(boxGeo,matTrainRoof); roof.scale.set(carW+.12,.22,carLen+.12); roof.position.y=2.32; car.add(roof);
    [-1,1].forEach(s=>{
      for(let w=0;w<2;w++){
        const win=new THREE.Mesh(boxGeo,matTrainWin); win.scale.set(.06,.62,.9); win.position.set(s*(carW/2+.02),1.5,-.9+w*1.8); car.add(win);
      }
      const stripe=new THREE.Mesh(boxGeo,giftMatB); stripe.scale.set(.07,.16,carLen); stripe.position.set(s*(carW/2+.02),.55,0); car.add(stripe);
    });
    car.position.z=-i*(carLen+.25);
    g.add(car);
  }
  const nose=new THREE.Mesh(boxGeo,matTrainRoof); nose.scale.set(carW,.9,.18); nose.position.set(0,1.4,carLen/2); g.add(nose);
  const wind=new THREE.Mesh(boxGeo,matTrainWin); wind.scale.set(carW-.4,.6,.2); wind.position.set(0,1.7,carLen/2+.02); g.add(wind);
  [-0.5,0.5].forEach(lx=>{
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),matLampBulb);
    lamp.position.set(lx,1.0,carLen/2+.1); g.add(lamp);
  });
  return g;
}
function spawnTrain(){
  const busy=new Set(obstacles.filter(o=>o.isTrain).map(o=>o.lane));
  const free=[0,1,2].filter(l=>!busy.has(l));
  if(!free.length) return;
  const lane=free[(Math.random()*free.length)|0];
  const g=makeTrain();
  g.position.set(LANES[lane],0,-100);
  obstacleRoot.add(g);
  obstacles.push({group:g,lane,z:-100,type:'train',isTrain:true});
}

function buildProps(th){
  sideItems.forEach(g=>propRoot.remove(g)); bgItems.forEach(g=>propRoot.remove(g));
  sideItems.length=0; bgItems.length=0;
  const prop=th.prop, night=state.period==='night';
  matTrunk.color.set(th.trunk); matBush.color.set(th.bush); matRock.color.set(th.rock);
  matLampBulb.color.set(th.glow);
  matCrown1.color.set(th.crown[0]); matCrown2.color.set(th.crown[1%th.crown.length]); matCrown3.color.set(th.crown[2%th.crown.length]);

  const isMaple=prop==='maple', isCity=prop==='city';

  for(let i=0;i<8;i++){
    const g=new THREE.Group(); const side=i%2?1:-1; const z=-i*18-6;
    if(isMaple){
      const tree=makeTree(th.crown, 1.05+Math.random()*.35);
      tree.position.set(side*6.4,0,0); g.add(tree);
      const bush=new THREE.Mesh(bushGeo,matBush); bush.position.set(side*4.6,.4,0); g.add(bush);
    } else if(isCity){
      if(Math.random()<.6){
        const tree=makeTree(th.crown,.85); tree.position.set(side*5.6,0,0); g.add(tree);
      }
      const lp=new THREE.Mesh(boxGeo,matLampPole); lp.scale.set(.1,3.1,.1); lp.position.set(side*4.2,1.55,0); g.add(lp);
      const bulb=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),matLampBulb); bulb.position.set(side*3.9,3.0,0); g.add(bulb);
    } else {
      const tree=makeTree(th.crown,1.15+Math.random()*.3,true); tree.position.set(side*6.0,0,0); g.add(tree);
      const rock=new THREE.Mesh(rockGeo,matRock); rock.scale.set(1.2+Math.random(),1.0+Math.random(),1.1); rock.position.set(side*(5.0+Math.random()*2),.7,0); g.add(rock);
      const bush=new THREE.Mesh(bushGeo,matBush); bush.position.set(side*4.4,.5,0); bush.scale.set(1.2,1,1.2); g.add(bush);
    }
    g.position.z=z; propRoot.add(g); sideItems.push(g);
  }
  for(let i=0;i<8;i++){
    const side=i%2?1:-1; const z=-30-Math.random()*140;
    if(isCity){
      const h=6+Math.random()*13,w=3+Math.random()*5;
      bgMat.color.set(night?0x0d1626:0x2a3648);
      const b=new THREE.Mesh(boxGeo,bgMat);
      b.scale.set(w,h,2); b.position.set(side*(16+Math.random()*18),h/2,z);
      propRoot.add(b); bgItems.push(b);
    } else {
      bgMat.color.set(th.crown[0]);
      const r=3+Math.random()*3;
      const b=new THREE.Mesh(bushGeo,bgMat);
      b.scale.set(r*1.4,r,r*1.2); b.position.set(side*(15+Math.random()*16),r*.7,z);
      propRoot.add(b); bgItems.push(b);
    }
  }
}

function applyTheme(){
  const th=THEMES[state.scene][state.period];
  scene.background=new THREE.Color(th.sky);
  scene.fog=new THREE.FogExp2(th.fog,th.fogD);
  ambient.color.set(th.ambient); ambient.intensity=th.ambI;
  hemi.color.set(th.hemiSky); hemi.groundColor.set(th.hemiGround); hemi.intensity=th.hemiI;
  key.color.set(th.key); key.intensity=th.keyI; rim.color.set(th.rim);
  sideMat.color.set(th.side);
  ground.material.color.set(th.ground);
  const oldGround=groundTex; groundTex=groundTexture(th.prop,th.line);
  ground.material.map=groundTex; ground.material.needsUpdate=true;
  if(oldGround)oldGround.dispose();
  particleMat.color.set(th.particle);
  wallMat.color.set(th.wall||0x8fb6dd);
  buildRails();
  railGroup.visible = !!th.train;
  buildProps(th);
}

/* ============ 音效 ============ */
let actx=null;
function beep(freq,dur=.12){
  if(state.muted)return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),gn=actx.createGain();
    o.type='sine';o.frequency.value=freq;gn.gain.setValueAtTime(.12,actx.currentTime);
    gn.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(gn);gn.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}

const isTouch=matchMedia('(pointer: coarse)').matches||'ontouchstart' in window;

function moveLane(dir){ if(state.phase!=='run')return;
  const nl=Math.max(0,Math.min(2,state.lane+dir));
  if(nl!==state.lane){ state.lane=nl; beep(dir>0?520:460); } }
function doJump(){ if(state.phase!=='run')return;
  if(state.jumpY>0.01)return; state.jumpVy=5.6; state.slideT=0; beep(660,.1); }
function doSlide(){ if(state.phase!=='run')return;
  if(state.jumpY>0.01){ state.jumpVy=-6; return; } state.slideT=.7; beep(300,.08); }

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')moveLane(-1); else if(e.key==='ArrowRight')moveLane(1);
  else if(e.key==='ArrowUp'||e.key===' '){ e.preventDefault(); doJump(); }
  else if(e.key==='ArrowDown')doSlide();
});
let touchStart=null;
canvas.addEventListener('pointerdown',e=>{ touchStart={x:e.clientX,y:e.clientY,t:Date.now()}; });
canvas.addEventListener('pointerup',e=>{
  if(!touchStart)return;
  const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y,dt=Date.now()-touchStart.t;
  touchStart=null; if(dt>600)return;
  if(Math.abs(dx)>Math.abs(dy)){ if(Math.abs(dx)>28)moveLane(dx>0?1:-1); }
  else { if(dy<-28)doJump(); else if(dy>28)doSlide(); }
});
document.getElementById('btnL').onclick=()=>moveLane(-1);
document.getElementById('btnR').onclick=()=>moveLane(1);
document.getElementById('btnUp').onclick=doJump;
document.getElementById('btnDown').onclick=doSlide;

document.getElementById('duo').addEventListener('click',e=>{
  const card=e.target.closest('.rcard'); if(!card)return;
  state.who=card.dataset.who; runnerImg.src=charTex[state.who].src;
  document.querySelectorAll('.rcard').forEach(c=>c.classList.toggle('on',c===card));
});
document.getElementById('sceneRow').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b)return;
  state.scene=b.dataset.scene;
  document.querySelectorAll('#sceneRow .opt').forEach(o=>o.classList.toggle('on',o===b));
  applyTheme();
});
document.getElementById('periodRow').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b)return;
  state.period=b.dataset.period;
  document.querySelectorAll('#periodRow .opt').forEach(o=>o.classList.toggle('on',o===b));
  applyTheme();
});

function resetGame(){
  obstacles.forEach(o=>obstacleRoot.remove(o.group)); coins.forEach(c=>coinRoot.remove(c.mesh));
  obstacles.length=0; coins.length=0;
  state.lane=1; state.x=0; state.jumpY=0; state.jumpVy=0; state.slideT=0;
  state.speed=16; state.score=0; state.coins=0; state.spawnAcc=0; state.nextGap=22; state.t=0;
  state.trainAcc=0; state.trainGap=6;
  placeRunner();
  scoreTxt.textContent='0'; coinTxt.textContent='0'; spdTxt.textContent='1.0x';
  resultMask.classList.remove('show');
}
function startGame(){
  resetGame();
  spawnRow(-42); spawnRow(-76); spawnRow(-112);
  state.phase='run';
  startOverlay.classList.add('hide');
  if(isTouch)pad.classList.add('show');
  beep(620,.1); setTimeout(()=>beep(820,.14),120);
}
function endGame(){
  state.phase='over'; pad.classList.remove('show');
  flash.style.opacity='1'; setTimeout(()=>flash.style.opacity='0',220);
  beep(160,.35);
  const sc=Math.floor(state.score);
  if(sc>state.best){ state.best=sc; localStorage.setItem('aylio_run_best',sc); }
  bestTxt.textContent=state.best;
  resScore.textContent=sc; resCoin.textContent=state.coins; resBest.textContent='最高分 '+state.best;
  resultMask.classList.add('show');
}
document.getElementById('btnStart').onclick=startGame;
document.getElementById('btnAgain').onclick=startGame;
function backHome(){
  resultMask.classList.remove('show');
  pad.classList.remove('show');
  state.phase='idle';
  startOverlay.classList.remove('hide');
  document.querySelectorAll('#sceneRow .opt').forEach(o=>o.classList.toggle('on',o.dataset.scene===state.scene));
  document.querySelectorAll('#periodRow .opt').forEach(o=>o.classList.toggle('on',o.dataset.period===state.period));
}
document.getElementById('btnBack').onclick=backHome;
document.getElementById('btnHome').onclick=backHome;

/* ============ 顶部面板：设置 / 声音 / 账号 / 公告 ============ */
const modalMask=document.getElementById('modalMask'),modalTitle=document.getElementById('modalTitle'),modalBody=document.getElementById('modalBody');
function openModal(title,html){ modalTitle.textContent=title; modalBody.innerHTML=html; modalMask.classList.add('show'); }
function closeModal(){ modalMask.classList.remove('show'); }
document.getElementById('modalClose').onclick=closeModal;
modalMask.addEventListener('click',e=>{ if(e.target===modalMask) closeModal(); });

const soundIcon=document.getElementById('soundIcon'),soundLabel=document.getElementById('soundLabel');
function refreshSound(){ soundIcon.textContent=state.muted?'🔇':'🔊'; soundLabel.textContent=state.muted?'已静音':'声音'; }
document.getElementById('btnSound').onclick=()=>{ state.muted=!state.muted; refreshSound(); if(!state.muted)beep(660,.08); };

document.getElementById('btnSetting').onclick=()=>{
  openModal('设置',`
    <div class="mrow"><span>音效 / 音乐</span><div class="switch ${state.muted?'':'on'}" id="swSound"></div></div>
    <div class="mnote">操作：← → 换道，↑ / 空格 跳跃，↓ 滑铲；手机滑动屏幕即可。铁轨场景注意躲开迎面开来的列车。</div>
    <button class="mbtn ghost" id="btnClear">清除最高分记录</button>
  `);
  document.getElementById('swSound').onclick=()=>{ state.muted=!state.muted; refreshSound(); document.getElementById('swSound').classList.toggle('on',!state.muted); };
  document.getElementById('btnClear').onclick=()=>{ localStorage.removeItem('aylio_run_best'); state.best=0; bestTxt.textContent='0'; };
};
document.getElementById('btnAccount').onclick=()=>{
  openModal('账号',`
    <div class="mstat">
      <div class="box"><b>${state.best}</b>最高分</div>
      <div class="box"><b>${state.who==='sitong'?'思瞳':'孙政'}</b>当前角色</div>
    </div>
    <div class="mnote">政瞳之家 · 粉丝自制互动站，账号数据保存在本机，无需注册登录。</div>
  `);
};
document.getElementById('btnNotice').onclick=()=>{
  openModal('公告',`
    <div class="mnote">v1.0 跑酷玩法上线：枫叶铁轨、城市公路、丛林土路三种场景，昼夜可切换。铁轨场景主要躲避迎面列车，提前变道躲开；路上也有少量障碍，跳跃或滑铲通过。收集星星刷新最高分。</div>
  `);
};

/* ============ 飘落粒子 ============ */
const PN=180;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(PN*3);
for(let i=0;i<PN;i++){ pPos[i*3]=(Math.random()-.5)*40; pPos[i*3+1]=Math.random()*20; pPos[i*3+2]=-Math.random()*160+10; }
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const particleMat=new THREE.PointsMaterial({color:0xffffff,size:.14,sizeAttenuation:true,transparent:true,opacity:.8,depthWrite:false});
const particles=new THREE.Points(pGeo,particleMat); scene.add(particles);

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  const t=performance.now()/1000;

  if(state.phase==='run'){
    state.t+=dt;
    state.speed=16+Math.min(19,state.t*.62);
    const dz=state.speed*dt;
    const targetX=LANES[state.lane];
    state.x+=(targetX-state.x)*Math.min(1,dt*11);

    if(state.jumpY>.001||state.jumpVy>0){ state.jumpVy-=12.5*dt; state.jumpY+=state.jumpVy*dt; if(state.jumpY<=0){state.jumpY=0;state.jumpVy=0;} }
    if(state.slideT>0)state.slideT=Math.max(0,state.slideT-dt);

    placeRunner();
    const shScale=1-Math.min(.4,state.jumpY*.3);
    shadowEl.style.width=(72*shScale)+'px';
    shadowEl.style.opacity=String(1-Math.min(.6,state.jumpY*.4));

    camera.position.x=state.x*0.82;
    camera.position.y=3.1+state.jumpY*.3;
    camera.position.z=3.4;
    camera.updateMatrixWorld();
    camera.lookAt(state.x*0.7,1.5+state.jumpY*.3,-8);
    camera.fov=58+Math.min(8,(state.speed-16)*.3); camera.updateProjectionMatrix();

    groundTex.offset.y-=dz*.045;

    state.spawnAcc+=dz;
    if(state.spawnAcc>state.nextGap){ state.spawnAcc=0; state.nextGap=24+Math.random()*16-Math.min(8,state.t*.25); spawnRow(-140); }

    state.trainAcc+=dt;
    if(state.trainAcc>state.trainGap && state.scene==='metro'){
      state.trainAcc=0; state.trainGap=5+Math.random()*2; spawnTrain();
    }

    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      const v=o.isTrain?dz+15*dt:dz;
      o.group.position.z+=v; o.z+=v;
      if(o.z>(o.isTrain?4:.4)){ obstacleRoot.remove(o.group); obstacles.splice(i,1); continue; }
      if(Math.abs(o.z)<1.1&&o.lane===state.lane){
        const hit=o.type==='train'?true:o.type==='gift'?state.jumpY<1.15:o.type==='bar'?state.slideT<=0:true;
        if(hit&&!window.__run.god){ endGame(); return; }
      }
    }
    for(let i=coins.length-1;i>=0;i--){
      const c=coins[i]; c.mesh.position.z+=dz; c.z+=dz; c.mesh.rotation.y+=dt*3.2;
      if(c.z>2.6){ coinRoot.remove(c.mesh); coins.splice(i,1); continue; }
      if(Math.abs(c.z)<1.3&&c.lane===state.lane){ coinRoot.remove(c.mesh); coins.splice(i,1);
        state.coins++; state.score+=6; coinTxt.textContent=state.coins; beep(900,.08); }
    }

    tieItems.forEach(tie=>{ tie.position.z+=dz; if(tie.position.z>14)tie.position.z-=18*8; });

    const pAttr=pGeo.attributes.position;
    for(let i=0;i<PN;i++){
      let y=pAttr.getY(i)-(1.4+i%3*.5)*dt;
      if(y<0){ y=20; pAttr.setX(i,(Math.random()-.5)*40); pAttr.setZ(i,-Math.random()*160+10); }
      pAttr.setY(i,y);
    }
    pAttr.needsUpdate=true;

    sideItems.forEach(g=>{ g.position.z+=dz; if(g.position.z>16)g.position.z-=144; });
    bgItems.forEach(g=>{ g.position.z+=dz; if(g.position.z>16)g.position.z-=170; });

    state.score+=dz*1.4;
    scoreTxt.textContent=Math.floor(state.score);
    spdTxt.textContent=(state.speed/16).toFixed(1)+'x';
  }

  renderer.render(scene,camera);
}

function resize(){
  const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
resize();
bestTxt.textContent=state.best;
applyTheme();
animate();

window.__run={ god:false, start:startGame, endGame, state, obstacles, coins, spawnRow, addObstacle, addCoinLine, spawnTrain, LANES, G, runnerImg, charTex,
  who:w=>{ state.who=w; runnerImg.src=charTex[w].src; },
  setScene:s=>{ state.scene=s; applyTheme(); }, setPeriod:p=>{ state.period=p; applyTheme(); } };
</script>
