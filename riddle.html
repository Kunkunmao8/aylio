<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>政瞳谜厅 · 三锁</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--ink:#080d18;--ink2:#101a2c;--gold:#e8b44a;--cream:#f3e8d3;--dim:#8b96ad;--cyan:#6fd6e8;--red:#e0665a;--green:#7fc98a;}
  html,body{height:100%;}
  body{background:var(--ink);color:var(--cream);font-family:"PingFang SC","Noto Sans SC",system-ui,-apple-system,sans-serif;overflow:hidden;}
  .app{position:relative;width:100%;height:100%;overflow:hidden;display:flex;justify-content:center;}
  .wrap{position:relative;width:100%;max-width:540px;height:100%;overflow:hidden;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;padding:24px 20px 30px;
    background:radial-gradient(ellipse at 25% 0%,rgba(232,180,74,.10),transparent 55%),
      radial-gradient(ellipse at 90% 90%,rgba(111,214,232,.07),transparent 50%),
      linear-gradient(180deg,#0c1322 0%,#080d18 100%);
    transition:opacity .26s,transform .26s;}
  .screen.off{opacity:0;transform:translateY(10px);pointer-events:none;}
  .screen.hide{display:none;}
  .topbar{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--dim);letter-spacing:1px;flex:0 0 auto;}
  .topbar button{background:none;border:none;color:var(--dim);font-family:inherit;font-size:12px;cursor:pointer;padding:4px 0;}
  .topbar button:hover{color:var(--gold);}

  /* 菜单 */
  .menuhead{text-align:center;padding:18px 0 8px;flex:0 0 auto;}
  .menuhead .seal{width:60px;height:60px;margin:0 auto 14px;border-radius:50%;border:2px solid rgba(232,180,74,.55);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--gold);box-shadow:0 0 24px rgba(232,180,74,.2) inset;position:relative;}
  .menuhead .seal::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(232,180,74,.25);animation:spin 26s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .menuhead h1{font-size:29px;letter-spacing:4px;font-weight:800;}
  .menuhead h1 em{font-style:normal;color:var(--gold);}
  .menuhead p{margin-top:8px;font-size:12px;letter-spacing:2.5px;color:var(--dim);}
  .cards{display:flex;flex-direction:column;gap:12px;margin-top:20px;flex:1;}
  .card{position:relative;border-radius:18px;padding:16px 16px 15px;border:1px solid rgba(232,180,74,.2);
    background:linear-gradient(135deg,rgba(232,180,74,.10),rgba(255,255,255,.03));
    display:flex;gap:14px;align-items:center;cursor:pointer;transition:.18s;overflow:hidden;}
  .card:hover{border-color:rgba(232,180,74,.55);transform:translateY(-1px);}
  .card .ic{width:52px;height:52px;border-radius:14px;background:radial-gradient(circle at 30% 25%,#2a3a56,#131c2c);
    display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid rgba(232,180,74,.25);flex:0 0 auto;}
  .card h3{font-size:15px;letter-spacing:1px;margin-bottom:5px;}
  .card p{font-size:11.5px;line-height:1.7;color:#9fabc2;}
  .card .st{margin-left:auto;font-size:10px;color:var(--gold);text-align:right;flex:0 0 auto;letter-spacing:1px;}
  .card .st i{display:block;width:8px;height:8px;border-radius:50%;background:rgba(232,180,74,.25);margin:6px 0 0 auto;}
  .card .st i.on{background:var(--gold);box-shadow:0 0 8px rgba(232,180,74,.6);}

  /* 通用 */
  .playhead{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--dim);letter-spacing:1px;flex:0 0 auto;}
  .playhead button{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;font-family:inherit;padding:4px 0;}
  .h3{font-size:18px;letter-spacing:1.5px;margin:12px 0 6px;flex:0 0 auto;}
  .sub{font-size:12px;line-height:1.9;color:#9fc7d2;margin-bottom:12px;flex:0 0 auto;}
  .stagebox{position:relative;width:100%;display:flex;justify-content:center;flex:0 0 auto;}
  .controls{margin-top:12px;display:flex;flex-direction:column;gap:9px;align-items:center;flex:0 0 auto;}
  .row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%;}
  .cbtn{padding:10px 18px;border-radius:12px;border:1px solid rgba(232,180,74,.35);background:rgba(232,180,74,.08);
    color:var(--cream);font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;}
  .cbtn:hover{background:rgba(232,180,74,.18);}
  .cbtn:active{transform:scale(.96);}
  .cbtn.primary{background:linear-gradient(180deg,#efc264,#d9a33a);color:#2a1d08;border:none;font-weight:700;}
  .cbtn:disabled{opacity:.4;cursor:not-allowed;}
  .tip{margin-top:10px;font-size:12.5px;color:var(--gold);min-height:20px;text-align:center;line-height:1.7;flex:0 0 auto;}
  .tip.bad{color:var(--red);}
  .bigbtn{padding:12px 34px;border:none;border-radius:999px;background:linear-gradient(180deg,#efc264,#d9a33a);
    color:#2a1d08;font-size:14.5px;letter-spacing:2px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(232,180,74,.26);}
  .bigbtn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(232,180,74,.5);box-shadow:none;font-weight:600;}
  .bigbtn:active{transform:translateY(2px);}

  /* 弹层 */
  .fx{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(4,8,15,.72);backdrop-filter:blur(4px);padding:22px;}
  .fx.show{display:flex;}
  .fxcard{width:min(340px,94%);background:linear-gradient(180deg,#141d31,#0e1526);border:1px solid rgba(232,180,74,.35);
    border-radius:20px;padding:22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .3s cubic-bezier(.2,1.4,.4,1);max-height:88%;overflow:auto;}
  @keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
  .fxcard h4{font-size:16px;letter-spacing:2px;margin-bottom:10px;text-align:center;}
  .fxcard p{font-size:13px;line-height:1.95;color:#c8d2e4;}
  .fxcard .paper{background:linear-gradient(180deg,#f3e8d3,#e6d8bd);color:#2b2417;border-radius:10px;padding:14px;font-size:12.5px;line-height:2;
    box-shadow:inset 0 0 30px rgba(120,96,50,.18);margin:8px 0 2px;}
  .fxcard .paper b{color:#8a5a12;}
  .fxcard .bigbtn{margin:16px auto 0;display:block;padding:9px 26px;font-size:13px;}

  footer{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.2);letter-spacing:1px;}
</style>

<style id="aylio-cream">
:root{--ink:#FBF3E9;--ink2:#F4E3D0;--gold:#B45B33;--gold2:#8E4A2A;--cream:#4A2E21;--dim:#8A6753;--cyan:#A9532D;--red:#A7412E;--green:#6F7D4E;}
html,body{background:#FBF3E9!important;color:#4A2E21!important;}
.stagewrap,.wrap{max-width:100%!important;}
.stagebox canvas{filter:brightness(1.06) sepia(.12) saturate(1.02);}
.topbar,.topbar button,.playhead,.playhead button,footer{color:#8A6753!important;}
.menuhead h1,.h3,.card h3,.fxcard h4{color:#4A2E21!important;}
.menuhead h1 em{color:#B45B33!important;}
.menuhead p{color:#8A6753!important;}
.menuhead .seal{border-color:rgba(180,91,51,.5)!important;color:#B45B33!important;box-shadow:0 0 24px rgba(180,91,51,.16) inset!important;}
.menuhead .seal::after{border-color:rgba(180,91,51,.22)!important;}
.hintline,.sub,.card p,.cover .desc,.story .lines,.fxcard p{color:#5C4030!important;}
.story .lines p.dim{color:#8A6753!important;}
.legend span,.tab{color:#7A5B47!important;}
.screen{background:radial-gradient(ellipse at 20% 0%,rgba(214,139,93,.12),transparent 55%),radial-gradient(ellipse at 90% 90%,rgba(180,91,51,.06),transparent 50%),linear-gradient(180deg,#FFF9F1 0%,#F5E6D4 100%)!important;}
.fx{background:rgba(74,46,33,.45)!important;}
.fxcard{background:linear-gradient(180deg,#FFF9F0,#F3E0CB)!important;border-color:#D9B48C!important;box-shadow:0 24px 60px rgba(90,45,20,.18)!important;}
.fxcard .paper{background:linear-gradient(180deg,#FFF8EC,#EEDCC4)!important;color:#3F2A1A!important;border-color:#DCC09B!important;}
.bigbtn,.cbtn.primary{background:linear-gradient(180deg,#D68B5D,#B45B33)!important;color:#FFF9F3!important;box-shadow:0 8px 20px rgba(180,91,51,.22)!important;}
.cbtn,.bigbtn.ghost{background:rgba(180,91,51,.08)!important;border-color:rgba(180,91,51,.35)!important;color:#4A2E21!important;box-shadow:none!important;}
.nocell{background:rgba(122,75,48,.08)!important;color:#8A6753!important;}
.nocell.cross{color:#B49A83!important;}
.card{background:linear-gradient(135deg,rgba(214,139,93,.14),rgba(255,249,241,.82))!important;border-color:rgba(180,91,51,.24)!important;}
.card .ic{background:radial-gradient(circle at 30% 25%,#FFF4E5,#EBCDB2)!important;border-color:rgba(180,91,51,.28)!important;color:#9A4B28!important;}
.card .st{color:#B45B33!important;}
.card .st i{background:rgba(180,91,51,.25)!important;}
.card .st i.on{background:#B45B33!important;box-shadow:0 0 8px rgba(180,91,51,.55)!important;}
.tip{color:#9A5532!important;}
.tip.bad{color:#A7412E!important;}
footer{color:#A98268!important;}
</style>
</head>
<body>
<div class="app"><div class="wrap">

  <div class="screen" id="scMenu">
    <div class="menuhead">
      <div class="seal">🔐</div>
      <h1>政瞳<em>谜厅</em></h1>
      <p>T H R E E · L O C K S</p>
    </div>
    <div class="cards" id="cards">
      <div class="card" data-game="vault">
        <div class="ic">🗄️</div>
        <div>
          <h3>旧物仓</h3>
          <p>四件旧物各藏一位密码，按它们留下的位次排成四位数。</p>
        </div>
        <div class="st">未解 <i id="dotVault"></i></div>
      </div>
      <div class="card" data-game="cipher">
        <div class="ic">🔡</div>
        <div>
          <h3>破译台</h3>
          <p>一整句话被换成了陌生字母，靠几个已知字母把它读回来。</p>
        </div>
        <div class="st">未解 <i id="dotCipher"></i></div>
      </div>
      <div class="card" data-game="hanzi">
        <div class="ic">漢</div>
        <div>
          <h3>字谜锁</h3>
          <p>四道字谜四个转轮，猜中一个字，锁就松一格。</p>
        </div>
        <div class="st">未解 <i id="dotHanzi"></i></div>
      </div>
    </div>
    <div class="controls" style="margin-top:18px">
      <button class="bigbtn ghost" id="btnReset">清空进度</button>
    </div>
  </div>

  <div class="screen hide" id="scPlay">
    <div class="playhead">
      <button id="btnBack">← 回谜厅</button>
      <span id="playTag">第一厅</span>
      <span id="playStep"></span>
    </div>
    <h3 class="h3" id="playTitle"></h3>
    <p class="sub" id="playHint"></p>
    <div class="stagebox" id="stage"></div>
    <div class="controls" id="controls"></div>
    <div class="tip" id="tip"></div>
  </div>

  <div class="screen hide" id="scEnd">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
      <div style="font-size:38px;color:var(--gold);margin-bottom:14px">🔓</div>
      <h2 style="font-size:25px;letter-spacing:4px;margin-bottom:14px;">三锁齐开</h2>
      <p style="font-size:13.5px;line-height:2.05;color:#c9d2e2;max-width:330px" id="endText"></p>
      <button class="bigbtn ghost" id="btnEndBack" style="margin-top:24px">回谜厅</button>
    </div>
  </div>

  <div class="fx" id="fx">
    <div class="fxcard">
      <h4 id="fxTitle">线索</h4>
      <div id="fxBody"></div>
      <button class="bigbtn" id="fxOk">知道了</button>
    </div>
  </div>

  <footer>© 2026 政瞳之家 · 谜厅</footer>
</div></div>

<script type="module">
let THREE;
try { THREE = await import('./three.full.module.js'); }
catch(e1) { try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'); }
catch(e2) { THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js'); } }

const SAVE_KEY='aylio_hall_v1';
const state={ done:{vault:false,cipher:false,hanzi:false}, mounted:null, cur:null };

/* DOM */
const scMenu=document.getElementById('scMenu'), scPlay=document.getElementById('scPlay'), scEnd=document.getElementById('scEnd');
const stage=document.getElementById('stage'), controls=document.getElementById('controls'), tipEl=document.getElementById('tip');
const fx=document.getElementById('fx'), fxTitle=document.getElementById('fxTitle'), fxBody=document.getElementById('fxBody');
const playTag=document.getElementById('playTag'), playTitle=document.getElementById('playTitle'),
      playHint=document.getElementById('playHint'), playStep=document.getElementById('playStep');

function show(el){
  [scMenu,scPlay,scEnd].forEach(s=>{
    if(s===el){ s.classList.remove('hide'); requestAnimationFrame(()=>s.classList.remove('off')); }
    else { s.classList.add('off'); setTimeout(()=>{ if(s.classList.contains('off')&&s!==el) s.classList.add('hide'); },190); }
  });
}
function setTip(m,bad){ tipEl.textContent=m||''; tipEl.classList.toggle('bad',!!bad); }
function showFx(title, html, cb){
  fxTitle.textContent=title;
  fxBody.innerHTML='';
  if(typeof html==='string'){ const p=document.createElement('div'); p.innerHTML=html; fxBody.appendChild(p); }
  else fxBody.appendChild(html);
  fxCb=cb||null;
  fx.classList.add('show');
}
let fxCb=null;
document.getElementById('fxOk').onclick=()=>{
  fx.classList.remove('show');
  const cb=fxCb; fxCb=null;
  if(cb) cb();
};

function save(){
  localStorage.setItem(SAVE_KEY, JSON.stringify(state.done));
  syncDots();
}
function load(){
  try{ const o=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); state.done=Object.assign(state.done,o||{}); }catch(e){}
}
function syncDots(){
  ['vault','cipher','hanzi'].forEach(k=>{
    const d=document.getElementById('dot'+(k==='vault'?'Vault':k==='cipher'?'Cipher':'Hanzi'));
    if(d) d.classList.toggle('on', !!state.done[k]);
    const st=d&&d.parentElement;
    if(st) st.textContent=state.done[k]?'已解 ':'未解 ';
    if(st) st.appendChild(d);
  });
}
function solvedAll(){ return state.done.vault&&state.done.cipher&&state.done.hanzi; }

const TAGS={vault:'第一厅 · 旧物仓', cipher:'第二厅 · 破译台', hanzi:'第三厅 · 字谜锁'};
const HINTS={
  vault:'点物件凑近查看：书架抽出夹纸条的书，抽屉拉开找车票，看钟面分针指着几，翻画框看背板。自己把数字和位次找齐，再去开门。',
  cipher:'每个怪字母下面留了一个空位。先填已经给出的字母，再看词的长度和重复位置，把整句话读出来。',
  hanzi:'每道字谜只对应一个字。想清楚拆字和会意，再点候选字；点错锁会晃一下。'
};

function openGame(game){
  if(!GAMES[game]){ setTip('还在加载，等一两秒再点。',true); return; }
  state.cur=game;
  playTag.textContent=TAGS[game];
  playTitle.textContent={vault:'旧物仓',cipher:'破译台',hanzi:'字谜锁'}[game];
  playHint.textContent=HINTS[game];
  playHint.style.display=(game==='vault')?'none':'';
  playStep.textContent='';
  stage.innerHTML=''; controls.innerHTML=''; setTip('');
  show(scPlay); scPlay.scrollTop=0;
  if(state.mounted&&state.mounted.destroy){ try{ state.mounted.destroy(); }catch(e){} }
  state.mounted=null;
  const api={ solve:()=>onSolve(game), setStep:t=>{ playStep.textContent=t; }, setTip };
  state.mounted=GAMES[game](stage,controls,api);
}
function onSolve(game){
  setTip('');
  state.done[game]=true; save();
  showFx('这一厅开了', '「'+playTitle.textContent+'」解开了。走廊尽头又亮起一盏灯。', ()=>{
    if(solvedAll()) openEnd(); else show(scMenu);
  });
}
function openEnd(){
  document.getElementById('endText').innerHTML='三把锁同时弹开。<br />门后不是走廊，是一间更小的房间：<br />桌上摊着两年前那张信纸，边上多了一行新写的字——<br /><br />“你们终于把这里逛完了。”<br /><br />字迹还很新。';
  show(scEnd);
}
document.getElementById('btnBack').onclick=()=>{
  if(state.mounted&&state.mounted.destroy){ try{ state.mounted.destroy(); }catch(e){} }
  state.mounted=null; show(scMenu);
};
document.getElementById('btnEndBack').onclick=()=>show(scMenu);
document.getElementById('btnReset').onclick=()=>{
  state.done={vault:false,cipher:false,hanzi:false};
  localStorage.removeItem(SAVE_KEY);
  syncDots();
};
document.querySelectorAll('.card').forEach(c=>{
  c.addEventListener('click',()=>openGame(c.dataset.game));
});

load(); syncDots();
const GAMES={};
const GEN={};
/* 通用随机工具 */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffleArr(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rndInt(rng,a,b){ return a+Math.floor(rng()*(b-a+1)); }

/* ============================================================
   第一厅 · 旧物仓（密室特写版：飞镜 + 物品级交互 + 音效震动）
   ============================================================ */
function makeVaultLevel(seed){
  const rng=mulberry32((seed>>>0)||1);
  const pool=shuffleArr([1,2,3,4,5,6,7,8,9],rng);
  const ord=shuffleArr([1,2,3,4],rng);
  const ids=['shelf','desk','clock','painting'];
  const data={};
  ids.forEach((id,i)=>{ data[id]={d:pool[i], p:ord[i]}; });
  // 钟面：分针指向的数字即数字线索 d；mm = d*5
  const time={hh:rndInt(rng,1,9), mm:data.clock.d*5};
  return {data, time};
}

GAMES.vault=function(stage, controls, api){
  const lvl=makeVaultLevel(Math.floor(Math.random()*2147483000));
  let code='';
  for(let p=1;p<=4;p++){
    for(const id in lvl.data) if(lvl.data[id].p===p) code+=lvl.data[id].d;
  }

  /* ---------- 音效 / 震动 ---------- */
  let AC=null;
  function ac(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); return AC; }catch(e){ return null; } }
  function tone(freq,dur,type='sine',gain=.16,delay=0){
    const a=ac(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=freq;
    const t=a.currentTime+delay;
    g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur);
  }
  const sndClick=()=>tone(660,.07,'triangle',.1);
  const sndOpen =()=>{ tone(392,.12,'triangle',.14); tone(523,.16,'triangle',.14,.09); };
  const sndBad  =()=>{ tone(150,.16,'square',.12); tone(110,.2,'square',.12,.12); if(navigator.vibrate) navigator.vibrate(90); };
  const sndGood =()=>{ tone(523,.14,'triangle',.16); tone(659,.14,'triangle',.16,.1); tone(784,.22,'triangle',.16,.2); };

  const S=Math.max(290, Math.min(stage.clientWidth||560, 560));
  const H=Math.round(S*0.9);
  const host=document.createElement('div');
  host.style.cssText='position:relative;width:'+S+'px;height:'+H+'px;border-radius:16px;overflow:hidden;border:1px solid rgba(232,180,74,.22);background:#2A1B12;box-shadow:inset 0 0 60px rgba(40,20,10,.55);';
  stage.appendChild(host);

  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  renderer.setSize(S,H,false);
  renderer.setClearColor(0x2A1B12,1);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.62;
  renderer.domElement.style.cssText='display:block;width:100%;height:100%;cursor:pointer;';
  host.appendChild(renderer.domElement);
  const vig=document.createElement('div');
  vig.style.cssText='position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 85% at 50% 42%,transparent 38%,rgba(40,20,10,.58) 100%);';

      showFx('钟圈边缘','铜圈内侧刻着一行小字：<b>第 '+lvl.data.clock.p+' 位</b>。<br />这一格的线索齐了：分针指 <b>'+lvl.data.clock.d+'</b>，排在第 <b>'+lvl.data.clock.p+'</b> 位。');
    }
  }
  function inspectPainting(sub){
    const c=clue.painting;
    if(sub.kind==='front'){
      showFx('画的正面','两片山坡和一颗落日。画框背面好像还贴着东西。'); sndClick(); return;

      else showFx('画框背面','背板角落刻着 <b>'+lvl.data.painting.d+'</b>。');
      return;
    }
    if(sub.kind==='board'){
      if(!c.flip){ showFx('背板','得先把画框翻过来。'); return; }
      if(!c.board){
        c.board=true;
        finishClue('painting');
        showFx('背板标签','背板刻着 <b>'+lvl.data.painting.d+'</b>，旁边标签写：<b>第 '+lvl.data.painting.p+' 位</b>。');

  /* ---------- 射线拾取 ---------- */
  const ray=new THREE.Raycaster();

  let raf=null, hovered=null, solved=false;
  let slipUp=0, slipUpAnim=0, tFlip=false, bookOpen=0;

  function pickGroup(ev){
    const rect=renderer.domElement.getBoundingClientRect();
    mouse.x=((ev.clientX-rect.left)/rect.width)*2-1;
    mouse.y=-((ev.clientY-rect.top)/rect.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObject(scene,true);
    for(const h of hits){
      let o=h.object;
      let vis=true, p=o;
      while(p){ if(p.visible===false){ vis=false; break; } p=p.parent; }
      if(!vis) continue;
      while(o&&!o.userData.sub) o=o.parent;
      if(o&&o.userData.sub) return o.userData.sub;
    }
    return null;
  }
  function setHover(sub){
    const key=sub?sub.g:null;
    if(hovered===key) return;

  renderer.domElement.addEventListener('pointermove',ev=>setHover(pickGroup(ev)));
  renderer.domElement.addEventListener('pointerleave',()=>setHover(null));

    const sub=pickGroup(ev);

  /* ---------- 特写操作按钮（翻面 / 合上） ---------- */

  actBar.style.cssText='position:absolute;left:0;right:0;top:54px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:6;pointer-events:none;';

  function updateActions(){
    actBar.innerHTML='';

      const b=document.createElement('button');

    };
    if(view==='painting'){
      add(clue.painting.flip?'翻回正面':'翻过来',()=>{
        clue.painting.flip=!clue.painting.flip; sndOpen(); updateActions();
        api.setTip(clue.painting.flip?'画框翻到了背面，点背板看刻痕。':'画框翻回正面。');
      });
    }
    if(view==='ticket'){

  /* ---------- 密码盘 ---------- */
  function openKeypad(){
    if(solved) return;

    const box=document.createElement('div');
    const slots=document.createElement('div');
    slots.style.cssText='display:flex;gap:10px;justify-content:center;margin:6px 0 4px;';

      d.style.cssText='width:46px;height:56px;border-radius:11px;border:1px solid rgba(232,180,74,.45);display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;color:#efc264;background:rgba(232,180,74,.09);font-family:ui-monospace,monospace;transition:.15s;';

    const grid=document.createElement('div');

    msg.style.cssText='text-align:center;font-size:12px;color:#9fc7d2;min-height:18px;margin-top:8px;';
    function refresh(){ slotEls.forEach((d,i)=>d.textContent=input[i]||''); }
    function flashBad(){ slotEls.forEach(d=>{ d.style.borderColor='#e0665a'; d.style.background='rgba(224,102,90,.18)'; }); setTimeout(()=>slotEls.forEach(d=>{ d.style.borderColor='rgba(232,180,74,.45)'; d.style.background='rgba(232,180,74,.09)'; }),380); }
    let shakeN=0;
    function shake(){
      if(shakeN) return; shakeN=1;
      const steps=[-9,8,-6,4,-2,0]; let k=0;
      const iv=setInterval(()=>{
        box.style.transform='translateX('+steps[k]+'px)'; k++;
        if(k>=steps.length){ clearInterval(iv); box.style.transform=''; shakeN=0; }
      },55);
    }
    function press(k){
      if(k==='del'){ input=input.slice(0,-1); }
      else if(k==='ok'){
        if(input.length<4){ msg.style.color='#e0a45a'; msg.textContent='要输满四位。'; return; }
        if(input===code){
          solved=true; msg.style.color='#7fc98a'; msg.textContent='咔——门开了。';
          drawPad(true); padTex.needsUpdate=true; sndGood();
          setTimeout(()=>{ fx.classList.remove('show'); api.solve(); }, 950);
        } else {
          sndBad(); flashBad(); shake();
          msg.style.color='#e0665a'; msg.textContent='不对。再看一遍每件物件留下的数字和位次。';
          input=''; refresh();
        }
        return;
      }
      else if(input.length<4) input+=k;
      refresh();
      msg.style.color='#9fc7d2'; msg.textContent=input.length?'已输入 '+input.length+' / 4':'点数字输入密码';
    }
    ['1','2','3','4','5','6','7','8','9','del','0','ok'].forEach(k=>{
      const b=document.createElement('button');
      b.className='cbtn';
      b.style.cssText='height:44px;font-size:15px;font-family:ui-monospace,monospace;padding:0;';
      b.textContent = k==='del'?'⌫':k==='ok'?'开':' '+k+' ';
      b.onclick=()=>press(k);
      grid.appendChild(b);
    });
    box.append(slots, grid, msg);
    refresh();
    msg.textContent='点数字输入密码';
    showFx('门 · 四位密码', box);
  }

  /* ---------- 底部按钮 ---------- */
  const rowWrap=document.createElement('div'); rowWrap.className='row';
  const noteBtn=document.createElement('button'); noteBtn.className='cbtn'; noteBtn.textContent='线索本';
  const doorBtn=document.createElement('button'); doorBtn.className='cbtn primary'; doorBtn.textContent='去开门';
  rowWrap.append(noteBtn,doorBtn); controls.appendChild(rowWrap);
  doorBtn.onclick=()=>openKeypad();
  noteBtn.onclick=()=>{
    const n=countDone();
    if(!n){ api.setTip('还没找到线索：先点房间里的书架、写字台、钟和画框，凑近了再翻找。',true); return; }
    let html='';
    for(const k in clue){
      if(!clue[k].done) continue;
      const v=lvl.data[k];
      html+='<div class="paper" style="margin-bottom:8px"><b>'+TITLES[k]+'</b><br/>数字 '+v.d+' · 第 '+v.p+' 位</div>';
    }
    showFx('线索本（'+n+'/4）', html);
  };

  refreshStep();
  api.setTip('点房间里的物件凑近查看：书架、写字台、钟、画框。');

  /* ---------- 动画循环 ---------- */
  function loop(){
    raf=requestAnimationFrame(loop);
    const dt=Math.min(clock4.getDelta(),0.05);
    const t=clock4.getElapsedTime();
    if(camT<1){
      camT=Math.min(1,camT+dt/0.55);
      const e=1-Math.pow(1-camT,3);
      cp.lerpVectors(cp0,VIEWS[view].pos,e);
      ct.lerpVectors(ct0,VIEWS[view].tgt,e);
    }
    camera.position.copy(cp); camera.lookAt(ct);
    books.forEach(b=>{
      const tz=b.pulled?0.42:(b===targetBook?0.16:0.06);
      b.mesh.position.z += (tz-b.mesh.position.z)*Math.min(1,dt*5.5);
      b.mesh.rotation.x += (((b.pulled)?-0.08:0)-b.mesh.rotation.x)*Math.min(1,dt*5.5);
      b.mesh.rotation.y += (((b.pulled)?b.baseY+0.34:b.baseY)-b.mesh.rotation.y)*Math.min(1,dt*5.5);
      if(b.hit) b.hit.position.z += ((b.pulled?0.3:0.1)-b.hit.position.z)*Math.min(1,dt*5.5);
    });
    if(bookOpen){
      bookOpen=Math.min(1,bookOpen+dt*2.2);
      pageR.rotation.x=-Math.PI/2*(1-bookOpen);
      slipCard.visible=bookOpen>0.85 && !slipFloatG.visible;
    }
    if(clue.desk.drawer){
      drawerGroup.position.z += (0.44-drawerGroup.position.z)*Math.min(1,dt*6);
    }
    const paintTarget=clue.painting.flip?Math.PI:0;
    paintGroup.rotation.y += (paintTarget-paintGroup.rotation.y)*Math.min(1,dt*6);
    backArt.visible=clue.painting.flip;
    const tickTarget=tFlip?Math.PI:0;
    ticketView.rotation.y += (tickTarget-ticketView.rotation.y)*Math.min(1,dt*6);
    padM.emissiveIntensity=0.75+Math.sin(t*2.2)*0.3;
    padFaceM.emissiveIntensity=0.45+Math.sin(t*2.2)*0.18;
    shadeM.emissiveIntensity=1.35+Math.sin(t*1.5)*0.2;
    dust.position.y=Math.sin(t*0.25)*0.12;
    dust.rotation.y=t*0.02;
    renderer.render(scene,camera);
  }
  loop();

  return {
    destroy(){
      cancelAnimationFrame(raf);
      geos.forEach(g=>g&&g.dispose&&g.dispose());
      mats.forEach(m=>m&&m.dispose&&m.dispose());
      renderer.dispose();
    },
    autoSolve(){
      solved=true;
      clue.shelf={book:true,slip:true,done:true};
      clue.desk={drawer:true,ticket:true,done:true};
      clue.clock={face:true,rim:true,done:true};
      clue.painting={flip:true,board:true,done:true};
      refreshStep();
      setTimeout(()=>api.solve(),1200);
    },
    code,
    debug:{
      gotoView:(x)=>gotoView(x), focus:()=>view, clue,
      targetBook: targetBook.mesh.userData.sub.bookId,
      act:(g,kind)=>{
        if(g==='shelf') inspectShelf({g:'shelf',kind,bookId:targetBook.mesh.userData.sub.bookId});
        else if(g==='desk') inspectDesk({g:'desk',kind});
        else if(g==='clock') inspectClock({g:'clock',kind});
        else if(g==='painting') inspectPainting({g:'painting',kind});
      }
    }
  };
};
/* ============================================================
   第二厅 · 破译台（字母替换密码）
   ============================================================ */
const CIPHER_SENTENCES=[
  'THE MOON KEEPS ITS OWN TIME',
  'A QUIET ROOM HOLDS THE LOUDEST SECRET',
  'EVERY LOCK WAS ONCE A DOOR',
  'WE LEFT A LETTER IN THE OLD BOX',
  'TIME IS A ROOM WITH NO WINDOWS',
  'THE CAT SLEEPS WHERE THE STARS FALL',
  'NOTHING HERE IS NEW BUT THE DUST',
  'FOUR KEYS AND ONE SMALL LAMP'
];
function makeCipherLevel(seed){
  const rng=mulberry32((seed>>>0)||1);
  const plain=CIPHER_SENTENCES[Math.floor(rng()*CIPHER_SENTENCES.length)];
  const letters=[...new Set(plain.replace(/ /g,'').split(''))];
  const alpha2=shuffleArr('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),rng);
  const cipherOf={}; letters.forEach((L,i)=>{ cipherOf[L]=alpha2[i]; });
  const cipherLetters=[...new Set(letters.map(L=>cipherOf[L]))];
  const anchors=shuffleArr(cipherLetters.slice(),rng).slice(0, Math.min(3,cipherLetters.length-1));
  return {plain, letters, cipherOf, cipherLetters, anchors};
}

GAMES.cipher=function(stage, controls, api){
  const lvl=makeCipherLevel(Math.floor(Math.random()*2147483000));
  const plain=lvl.plain;
  const cipherOf=lvl.cipherOf;
  const cipherLetters=lvl.cipherLetters;
  const trueMap={}; cipherLetters.forEach(cl=>{ for(const p in cipherOf) if(cipherOf[p]===cl) trueMap[cl]=p; });
  const user={};
  lvl.anchors.forEach(cl=>{ user[cl]=trueMap[cl]; });

  const box=document.createElement('div');
  box.style.cssText='width:100%;display:flex;flex-direction:column;gap:12px;';
  stage.appendChild(box);

  const cipherLine=document.createElement('div');
  cipherLine.style.cssText='display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(232,180,74,.18);';
  plain.split(' ').forEach(w=>{
    const pill=document.createElement('div');
    pill.style.cssText='display:flex;gap:2px;padding:4px 6px;border-radius:6px;background:rgba(0,0,0,.25);';
    w.split('').forEach(ch=>{
      const s=document.createElement('span');
      s.textContent=cipherOf[ch];
      s.style.cssText='width:15px;text-align:center;font-family:ui-monospace,monospace;font-size:13px;color:#b9c8e0;';
      pill.appendChild(s);
    });
    cipherLine.appendChild(pill);
  });

  const preview=document.createElement('div');
  preview.style.cssText='display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:4px 0;min-height:30px;';
  const keyGrid=document.createElement('div');
  keyGrid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;';

  const inputs={};
  cipherLetters.forEach(cl=>{
    const cell=document.createElement('div');
    cell.style.cssText='display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);';
    const lab=document.createElement('span');
    lab.textContent=cl;
    lab.style.cssText='font-family:ui-monospace,monospace;font-size:14px;color:#8fdcff;width:14px;';
    const inp=document.createElement('input');
    inp.maxLength=1;
    inp.style.cssText='width:26px;height:26px;text-align:center;border-radius:7px;border:1px solid rgba(232,180,74,.3);background:rgba(0,0,0,.35);color:#f3e8d3;font-size:14px;font-family:ui-monospace,monospace;text-transform:uppercase;';
    if(user[cl]){ inp.value=user[cl]; inp.disabled=true; inp.style.color='#efc264'; inp.style.borderColor='rgba(232,180,74,.6)'; }
    inp.addEventListener('input',()=>{
      const v=(inp.value||'').toUpperCase().replace(/[^A-Z]/g,'');
      inp.value=v;
      if(v) user[cl]=v; else delete user[cl];
      drawPreview();
    });
    cell.append(lab,inp);
    keyGrid.appendChild(cell);
    inputs[cl]=inp;
  });

  box.append(cipherLine, preview, keyGrid);

  function drawPreview(){
    preview.innerHTML='';
    plain.split(' ').forEach(w=>{
      const pill=document.createElement('div');
      pill.style.cssText='display:flex;gap:2px;padding:3px 5px;border-radius:6px;';
      w.split('').forEach(ch=>{
        const s=document.createElement('span');
        s.textContent = user[cipherOf[ch]] ? user[cipherOf[ch]] : '·';
        s.style.cssText='width:14px;text-align:center;font-family:ui-monospace,monospace;font-size:13px;'+
          (user[cipherOf[ch]]?'color:#efc264;':'color:#4a5568;');
        pill.appendChild(s);
      });
      preview.appendChild(pill);
    });
  }

  const row1=document.createElement('div'); row1.className='row';
  const check=document.createElement('button'); check.className='cbtn primary'; check.textContent='破译';
  const hintB=document.createElement('button'); hintB.className='cbtn'; hintB.textContent='提示一个字母';
  const clearB=document.createElement('button'); clearB.className='cbtn'; clearB.textContent='重置';
  row1.append(check,hintB,clearB); controls.appendChild(row1);

  let solved=false;
  check.onclick=()=>{
    if(solved) return;
    let filled=0; cipherLetters.forEach(cl=>{ if(user[cl]) filled++; });
    if(filled<cipherLetters.length){ api.setTip('还有 '+(cipherLetters.length-filled)+' 个字母空着。',true); return; }
    let wrong=0; cipherLetters.forEach(cl=>{ if(user[cl]!==trueMap[cl]) wrong++; });
    if(wrong===0){
      solved=true; check.disabled=hintB.disabled=true;
      api.setTip('读通了：「'+plain+'」——第二厅的锁开了。');
      preview.querySelectorAll('span').forEach(s=>{ s.style.color='#7fc98a'; });
      setTimeout(()=>api.solve(),1600);
    } else {
      api.setTip('还读不通，有 '+wrong+' 个字母对错位。看看单词长度和重复的位置。',true);
    }
  };
  hintB.onclick=()=>{
    if(solved) return;
    const left=cipherLetters.filter(cl=>user[cl]!==trueMap[cl]);
    if(!left.length){ api.setTip('已经全对了，按下“破译”。'); return; }
    const cl=left[Math.floor(Math.random()*left.length)];
    user[cl]=trueMap[cl];
    inputs[cl].value=user[cl]; inputs[cl].disabled=true;
    inputs[cl].style.color='#efc264'; inputs[cl].style.borderColor='rgba(232,180,74,.6)';
    drawPreview();
    api.setTip('“'+cl+'” 就是 “'+trueMap[cl]+'”，帮你标上了。');
  };
  clearB.onclick=()=>{
    if(solved) return;
    cipherLetters.forEach(cl=>{
      if(lvl.anchors.indexOf(cl)>=0) return;
      delete user[cl]; inputs[cl].value=''; inputs[cl].disabled=false;
      inputs[cl].style.color='#f3e8d3'; inputs[cl].style.borderColor='rgba(232,180,74,.3)';
    });
    drawPreview(); api.setTip('');
  };

  drawPreview();
  api.setStep(cipherLetters.length+' 个怪字母');
  return {
    destroy(){},
    autoSolve(){
      cipherLetters.forEach(cl=>{ user[cl]=trueMap[cl]; if(inputs[cl]){ inputs[cl].value=user[cl]; } });
      drawPreview(); check.click();
    }
  };
};

  {q:'女子相伴', a:'好', hint:'女 + 子。'},
  {q:'人在云上', a:'会', hint:'人字盖在云上。'},
  {q:'一口咬定', a:'交', hint:'“咬”字去口，剩下“交”。'}
];
GAMES.hanzi=function(stage, controls, api){
  const rng=mulberry32(Math.floor(Math.random()*2147483000));
  const bank=shuffleArr(RIDDLES.slice(),rng).slice(0,4);
  const allChars=RIDDLES.map(r=>r.a);
  let solvedCount=0;

  const wrap=document.createElement('div');
  wrap.style.cssText='width:100%;display:flex;flex-direction:column;gap:10px;';
  stage.appendChild(wrap);

  const cards=bank.map((rd,idx)=>{
    const card=document.createElement('div');
    card.style.cssText='border-radius:16px;padding:13px 14px;border:1px solid rgba(232,180,74,.22);background:linear-gradient(135deg,rgba(232,180,74,.09),rgba(255,255,255,.02));transition:.2s;';
    const head=document.createElement('div');
    head.style.cssText='display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#8b96ad;letter-spacing:1px;margin-bottom:8px;';
    head.innerHTML='<span>锁 · 第 '+['一','二','三','四'][idx]+' 格</span><span style="color:#4a5568">○</span>';
    const q=document.createElement('div');
    q.textContent=rd.q;
    q.style.cssText='font-size:15px;letter-spacing:1.5px;margin-bottom:11px;color:#f3e8d3;';
    const opts=document.createElement('div');
    opts.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:8px;';
    const hint=document.createElement('div');
    hint.style.cssText='font-size:11.5px;color:#8fdcff;line-height:1.7;margin-top:9px;display:none;';

    let wrongs=0, done=false;
    const chars=shuffleArr([rd.a, ...shuffleArr(allChars.filter(c=>c!==rd.a),rng).slice(0,5)],rng);
    const btns={};
    chars.forEach(ch=>{
      const b=document.createElement('button');
      b.textContent=ch;
      b.style.cssText='height:44px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.3);color:#dbe4f2;font-size:19px;font-family:inherit;cursor:pointer;transition:.14s;';
      b.onclick=()=>{
        if(done) return;
        if(ch===rd.a){
          done=true; solvedCount++;
          card.style.borderColor='rgba(232,180,74,.75)';
          card.style.background='linear-gradient(135deg,rgba(232,180,74,.26),rgba(255,255,255,.04))';
          head.lastElementChild.textContent='🔓'; head.lastElementChild.style.color='#efc264';
          q.style.color='#efc264';
          Object.keys(btns).forEach(k=>{ btns[k].disabled=true; btns[k].style.opacity=k===rd.a?'1':'0.3'; });
          b.style.borderColor='#efc264'; b.style.background='linear-gradient(180deg,#efc264,#d9a33a)'; b.style.color='#2a1d08';
          api.setTip('“'+rd.a+'”——一格打开了。（'+solvedCount+'/4）');
          if(solvedCount===4){ setTimeout(()=>api.solve(), 1500); }
        } else {
          wrongs++;
          card.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:240});
          api.setTip('不是“'+ch+'”。再拆一次字。',true);
          if(wrongs>=2){ hint.style.display='block'; hint.textContent='提示：'+rd.hint; }
        }
      };
      btns[ch]=b;
      opts.appendChild(b);
    });
    card.append(head,q,opts,hint);
    wrap.appendChild(card);
    return card;
  });

  api.setStep('0 / 4');
  const row=document.createElement('div'); row.className='row';
  const hintAll=document.createElement('button'); hintAll.className='cbtn'; hintAll.textContent='给一格提示';
  hintAll.onclick=()=>{
    for(let k=0;k<bank.length;k++){
      const h=cards[k].lastElementChild;
      if(h.style.display!=='block'){ h.style.display='block'; h.textContent='提示：'+bank[k].hint; api.setTip('第 '+['一','二','三','四'][k]+' 格的提示放出来了。'); return; }
    }
    api.setTip('四格提示都放出来了。');
  };
  row.appendChild(hintAll); controls.appendChild(row);

  return {
    destroy(){},
    autoSolve(){
      bank.forEach((rd,i)=>{ const b=[...cards[i].querySelectorAll('button')].find(x=>x.textContent===rd.a); if(b) b.click(); });
    }
  };
};
</script>
</body>
</html>
